<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍅 番茄闹钟 · 模组版 + 任务清单</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        :root {
            --primary: #e74c3c;
            --primary-dark: #c0392b;
            --secondary: #3498db;
            --accent: #2ecc71;
            --gold: #f1c40f;
            --dark: #1e2a3a;
            --gray: #7f8c8d;
            --white: #ffffff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            background: linear-gradient(145deg, #f0f2f5 0%, #dbe0e8 100%);
            min-height: 100vh;
            display: flex;
            color: var(--dark);
            font-size: 15px;
        }
        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 230px;
            background: var(--dark);
            color: var(--white);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            min-height: 100vh;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }
        .logo {
            text-align: center;
            padding: 8px 20px 24px;
            font-size: 1.6rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
        }
        .logo i {
            color: var(--primary);
            margin-right: 8px;
        }
        .logo span {
            color: var(--gold);
        }
        .nav-items {
            flex: 1;
        }
        .nav-item {
            padding: 14px 24px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            margin: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
        }
        .nav-item i {
            margin-right: 14px;
            width: 22px;
            text-align: center;
            font-size: 1.1rem;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--white);
        }
        .nav-item.active {
            background: rgba(231, 76, 60, 0.2);
            color: var(--white);
            border-left-color: var(--primary);
        }
        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
        }
        /* ===== 主内容 ===== */
        .main-content {
            flex: 1;
            padding: 24px 28px 40px;
            overflow-y: auto;
            max-height: 100vh;
        }
        /* ===== 顶部状态栏 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            padding: 16px 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--dark);
        }
        .header h1 i {
            color: var(--primary);
            margin-right: 8px;
        }
        .stats {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            background: var(--light);
        }
        .stat-icon.tomato {
            background: #fde8e8;
            color: var(--primary);
        }
        .stat-icon.exp {
            background: #e3f0fd;
            color: var(--secondary);
        }
        .stat-icon.level {
            background: #e3f9ec;
            color: var(--accent);
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.2;
        }
        /* ===== 面板 ===== */
        .panel {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
            margin-bottom: 28px;
            transition: var(--transition);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
            gap: 10px;
        }
        .panel-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark);
        }
        .panel-title i {
            margin-right: 10px;
            color: var(--primary);
        }
        .content-section {
            display: none;
            animation: fadeUp 0.35s ease;
        }
        .content-section.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* ===== 计时器 ===== */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 10px 0;
        }
        .timer-display {
            font-size: 5.5rem;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            margin: 8px 0 12px;
            background: linear-gradient(135deg, var(--dark), #3a4a5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .timer-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 16px;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.35);
        }
        .btn-secondary {
            background: var(--secondary);
            color: white;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.35);
        }
        .btn-accent {
            background: var(--accent);
            color: white;
        }
        .btn-accent:hover:not(:disabled) {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.35);
        }
        .btn-gold {
            background: var(--gold);
            color: var(--dark);
        }
        .btn-gold:hover:not(:disabled) {
            background: #f39c12;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(241, 196, 15, 0.35);
        }
        .btn-outline {
            background: transparent;
            color: var(--gray);
            border: 2px solid #ddd;
        }
        .btn-outline:hover:not(:disabled) {
            border-color: var(--gray);
            color: var(--dark);
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover:not(:disabled) {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.35);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .btn-xs {
            padding: 4px 10px;
            font-size: 0.7rem;
        }
        .progress-container {
            width: 100%;
            max-width: 500px;
            height: 8px;
            background: var(--light);
            border-radius: 8px;
            overflow: hidden;
            margin: 12px 0 8px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--gold));
            width: 0%;
            transition: width 0.5s linear;
            border-radius: 8px;
        }
        .status-message {
            font-size: 1.05rem;
            color: var(--gray);
            margin-top: 6px;
            min-height: 28px;
        }
        .duration-setting {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin: 10px 0 6px;
            flex-wrap: wrap;
        }
        .duration-setting label {
            font-weight: 600;
            color: var(--dark);
        }
        .duration-setting input {
            width: 70px;
            padding: 6px 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            font-weight: 600;
        }
        .duration-setting input:focus {
            outline: none;
            border-color: var(--secondary);
        }
        .duration-setting span {
            font-weight: 500;
            color: var(--gray);
        }
        /* ===== 商店 & 背包 ===== */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 18px;
        }
        .item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: var(--transition);
            border: 1px solid transparent;
            position: relative;
        }
        .item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
            border-color: #e0e4e8;
        }
        .item-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: var(--dark);
        }
        .item-name {
            font-weight: 600;
            text-align: center;
            margin-bottom: 2px;
        }
        .item-desc {
            font-size: 0.8rem;
            color: var(--gray);
            text-align: center;
            margin-bottom: 8px;
            min-height: 36px;
            line-height: 1.3;
        }
        .item-price {
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .item .btn {
            width: 100%;
            justify-content: center;
            font-size: 0.85rem;
            padding: 10px 12px;
        }
        .item .btn:disabled {
            background: #ccc;
            color: #888;
        }
        .item-actions {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .item-actions .btn {
            flex: 1;
        }
        .item-actions .btn-danger,
        .item-actions .btn-secondary {
            flex: 0 0 auto;
            padding: 6px 12px;
            font-size: 0.75rem;
        }
        .dependency-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
            display: inline-block;
        }
        .dep-ok {
            background: #d4edda;
            color: #155724;
        }
        .dep-miss {
            background: #f8d7da;
            color: #721c24;
        }
        .dep-list {
            font-size: 0.7rem;
            color: var(--gray);
            margin: 4px 0 8px;
            text-align: center;
            max-width: 100%;
            word-break: break-all;
        }
        .backpack-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }
        .backpack-item {
            position: relative;
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: var(--transition);
        }
        .backpack-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }
        .item-count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--primary);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
        }
        .backpack-item .item-name {
            font-size: 0.9rem;
        }
        .backpack-item .btn {
            width: 100%;
            justify-content: center;
            font-size: 0.8rem;
            padding: 8px 12px;
            margin-top: 6px;
        }
        .empty-message {
            text-align: center;
            color: var(--gray);
            padding: 30px 0;
            font-size: 1rem;
        }
        .empty-message i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
            color: #ddd;
        }
        /* ===== 表单 ===== */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--dark);
            font-size: 0.9rem;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e8ecf0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: #fafbfc;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.12);
            background: var(--white);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }
        .form-actions .btn {
            flex: 1 1 auto;
        }
        /* ===== 任务清单 ===== */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .task-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px 18px;
            border-left: 4px solid var(--secondary);
            transition: var(--transition);
        }
        .task-item.completed {
            border-left-color: var(--accent);
            opacity: 0.7;
        }
        .task-item .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .task-item .task-name {
            font-weight: 600;
            font-size: 1.05rem;
        }
        .task-item .task-desc {
            color: var(--gray);
            font-size: 0.9rem;
            margin: 4px 0 8px;
        }
        .task-item .task-progress {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 6px 0 10px;
        }
        .task-item .task-progress .task-bar {
            flex: 1;
            height: 6px;
            background: #e0e4e8;
            border-radius: 4px;
            overflow: hidden;
        }
        .task-item .task-progress .task-bar .task-fill {
            height: 100%;
            background: var(--secondary);
            transition: width 0.5s;
            border-radius: 4px;
        }
        .task-item .task-progress .task-text {
            font-size: 0.85rem;
            color: var(--gray);
            white-space: nowrap;
        }
        .task-item .task-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .task-item .task-actions .btn {
            padding: 4px 12px;
            font-size: 0.75rem;
        }
        .task-item .task-status {
            font-size: 0.8rem;
            font-weight: 500;
        }
        .task-item .task-status.done {
            color: var(--accent);
        }
        .task-item .task-status.pending {
            color: var(--secondary);
        }
        .task-item .task-status.locked {
            color: var(--gray);
        }
        .task-item .task-reward {
            font-size: 0.8rem;
            color: var(--gold);
            margin-top: 4px;
        }
        /* ===== 统计 ===== */
        .tab-container {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #eee;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 22px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 500;
            color: var(--gray);
            transition: var(--transition);
            border-radius: 8px 8px 0 0;
        }
        .tab:hover {
            color: var(--dark);
            background: #f5f6f8;
        }
        .tab.active {
            border-bottom-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
            background: rgba(231, 76, 60, 0.04);
        }
        .tab-content {
            display: none;
            animation: fadeUp 0.25s ease;
        }
        .tab-content.active {
            display: block;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px 18px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--dark);
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: var(--gray);
        }
        .stat-card .icon {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        .level-bar {
            height: 8px;
            background: #eef0f2;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 4px;
        }
        .level-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #27ae60);
            border-radius: 8px;
            transition: width 0.6s ease;
        }
        /* ===== 通知 ===== */
        .notification {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 16px 24px;
            background: var(--dark);
            color: white;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            transform: translateX(calc(100% + 40px));
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 420px;
            font-weight: 500;
            backdrop-filter: blur(8px);
            background: rgba(30, 42, 58, 0.92);
        }
        .notification i {
            font-size: 1.3rem;
            color: var(--gold);
        }
        .notification.show {
            transform: translateX(0);
        }
        .notification.success i {
            color: var(--accent);
        }
        .notification.warning i {
            color: var(--gold);
        }
        .notification.error i {
            color: var(--primary);
        }
        /* ===== 响应式 ===== */
        @media (max-width: 1024px) {
            .sidebar {
                width: 200px;
                padding: 16px 0;
            }
            .logo {
                font-size: 1.3rem;
                padding: 4px 16px 16px;
            }
            .nav-item {
                padding: 12px 16px;
                font-size: 0.9rem;
            }
        }
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-height: auto;
                height: auto;
                position: relative;
                padding: 10px 0;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
            }
            .logo {
                padding: 4px 16px;
                border-bottom: none;
                margin-bottom: 0;
                font-size: 1.1rem;
            }
            .nav-items {
                display: flex;
                overflow-x: auto;
                padding: 4px 8px;
                gap: 4px;
                flex: 1;
                justify-content: flex-start;
            }
            .nav-item {
                padding: 8px 14px;
                margin: 0 2px;
                font-size: 0.8rem;
                white-space: nowrap;
                border-left: none;
                border-bottom: 3px solid transparent;
            }
            .nav-item.active {
                border-left: none;
                border-bottom-color: var(--primary);
            }
            .sidebar-footer {
                display: none;
            }
            .main-content {
                padding: 16px;
                max-height: none;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 16px;
            }
            .stats {
                justify-content: space-around;
            }
            .timer-display {
                font-size: 3.8rem;
            }
            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            .backpack-items {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .panel {
                padding: 18px;
            }
            .notification {
                top: 12px;
                right: 12px;
                left: 12px;
                max-width: none;
                font-size: 0.9rem;
                padding: 14px 18px;
            }
        }
        @media (max-width: 480px) {
            .timer-display {
                font-size: 2.8rem;
            }
            .stat-item {
                gap: 6px;
            }
            .stat-icon {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
            .stat-value {
                font-size: 1rem;
            }
            .btn {
                padding: 10px 18px;
                font-size: 0.85rem;
            }
        }
        .file-input-hidden {
            display: none;
        }
        .edit-badge {
            background: var(--secondary);
            color: white;
            border-radius: 12px;
            padding: 2px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 10px;
        }
        .mod-group {
            font-size: 0.7rem;
            color: var(--secondary);
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- ===== 侧边栏 ===== -->
    <aside class="sidebar">
        <div class="logo"><i class="fas fa-stopwatch"></i> 番茄<span>模组</span></div>
        <nav class="nav-items">
            <div class="nav-item active" data-target="timer"><i class="fas fa-clock"></i> 番茄计时</div>
            <div class="nav-item" data-target="store"><i class="fas fa-store"></i> 商店</div>
            <div class="nav-item" data-target="backpack"><i class="fas fa-backpack"></i> 背包</div>
            <div class="nav-item" data-target="tasks"><i class="fas fa-tasks"></i> 任务</div>
            <div class="nav-item" data-target="create"><i class="fas fa-plus-circle"></i> 创建商品</div>
            <div class="nav-item" data-target="stats"><i class="fas fa-chart-line"></i> 统计</div>
        </nav>
        <div class="sidebar-footer">v3.1 · 任务清单模组</div>
    </aside>

    <!-- ===== 主内容 ===== -->
    <main class="main-content">

        <!-- 顶部状态栏 -->
        <header class="header">
            <h1><i class="fas fa-apple-alt"></i> 专注工作</h1>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-icon tomato"><i class="fas fa-apple-alt"></i></div>
                    <div><div class="stat-value" id="tomato-counter">0</div><div class="stat-label">番茄币</div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon exp"><i class="fas fa-star"></i></div>
                    <div><div class="stat-value" id="exp-counter">0 / 100</div><div class="stat-label">经验值</div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon level"><i class="fas fa-level-up-alt"></i></div>
                    <div><div class="stat-value" id="level-counter">1</div><div class="stat-label">等级</div></div>
                </div>
            </div>
        </header>

        <!-- ===== 番茄计时 ===== -->
        <section class="panel content-section active" id="timer-section">
            <div class="timer-container">
                <div class="duration-setting">
                    <label for="duration-input">⏱️ 专注时长</label>
                    <input type="number" id="duration-input" min="1" max="99" value="25" />
                    <span>分钟</span>
                </div>
                <div class="timer-display" id="timer-display">25:00</div>
                <div class="timer-controls">
                    <button class="btn btn-primary" id="btn-start"><i class="fas fa-play"></i> 开始</button>
                    <button class="btn btn-secondary" id="btn-pause" disabled><i class="fas fa-pause"></i> 暂停</button>
                    <button class="btn btn-outline" id="btn-reset" disabled><i class="fas fa-undo"></i> 重置</button>
                </div>
                <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
                <div class="status-message" id="status">🍅 准备开始工作吧！</div>
            </div>
        </section>

        <!-- ===== 商店 ===== -->
        <section class="panel content-section" id="store-section">
            <div class="panel-header">
                <h2 class="panel-title"><i class="fas fa-store"></i> 番茄商店</h2>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-secondary" id="btn-refresh-store"><i class="fas fa-sync-alt"></i> 刷新</button>
                    <button class="btn btn-gold" id="btn-export-items"><i class="fas fa-download"></i> 导出全部</button>
                    <button class="btn btn-gold" id="btn-import-items"><i class="fas fa-upload"></i> 导入合并</button>
                    <input type="file" id="file-input-import" class="file-input-hidden" accept=".shem" />
                </div>
            </div>
            <div class="items-grid" id="store-items"></div>
        </section>

        <!-- ===== 背包 ===== -->
        <section class="panel content-section" id="backpack-section">
            <div class="panel-header">
                <h2 class="panel-title"><i class="fas fa-backpack"></i> 我的背包</h2>
            </div>
            <div class="backpack-items" id="backpack-items"></div>
        </section>

        <!-- ===== 任务清单 ===== -->
        <section class="panel content-section" id="tasks-section">
            <div class="panel-header">
                <h2 class="panel-title"><i class="fas fa-tasks"></i> 任务清单</h2>
                <button class="btn btn-primary btn-sm" id="btn-add-task"><i class="fas fa-plus"></i> 新建任务</button>
            </div>
            <div id="task-form-container" style="display:none;margin-bottom:20px;padding:16px;background:#f8fafc;border-radius:12px;">
                <form id="task-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-name">任务名称</label>
                            <input type="text" id="task-name" required placeholder="输入任务名称" />
                        </div>
                        <div class="form-group">
                            <label for="task-target">目标番茄数</label>
                            <input type="number" id="task-target" required min="1" value="5" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="task-desc">任务描述</label>
                        <textarea id="task-desc" placeholder="任务描述（可选）"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-reward-type">奖励类型</label>
                            <select id="task-reward-type">
                                <option value="tomato">🍅 番茄币</option>
                                <option value="exp">⭐ 经验值</option>
                                <option value="item">🎁 指定物品</option>
                                <option value="lootbox">🎁 开箱</option>
                            </select>
                        </div>
                        <div class="form-group" id="task-reward-item-group" style="display:none;">
                            <label for="task-reward-item">物品ID</label>
                            <input type="text" id="task-reward-item" placeholder="输入物品ID (例如 u_123)" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="task-reward-amount">奖励数量</label>
                        <input type="number" id="task-reward-amount" min="1" value="1" />
                    </div>
                    <div class="form-group">
                        <label for="task-deps">依赖物品 (ID，逗号分隔)</label>
                        <input type="text" id="task-deps" placeholder="例如: u_123, u_456" />
                        <div style="font-size:0.75rem;color:var(--gray);margin-top:4px;">拥有这些物品才能开始此任务</div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="btn-task-submit"><i class="fas fa-save"></i> 保存任务</button>
                        <button type="button" class="btn btn-outline" id="btn-task-cancel">取消</button>
                    </div>
                </form>
            </div>
            <div id="task-list-container" class="task-list"></div>
        </section>

        <!-- ===== 创建商品 ===== -->
        <section class="panel content-section" id="create-section">
            <div class="panel-header">
                <h2 class="panel-title" id="create-panel-title">
                    <i class="fas fa-plus-circle"></i> 创建商品
                    <span id="edit-badge" class="edit-badge" style="display:none;">编辑中</span>
                </h2>
                <button class="btn btn-outline btn-sm" id="btn-cancel-edit" style="display:none;"><i class="fas fa-times"></i> 取消编辑</button>
            </div>
            <form id="item-form">
                <div class="form-group">
                    <label for="item-name">商品名称</label>
                    <input type="text" id="item-name" required placeholder="输入商品名称" />
                </div>
                <div class="form-group">
                    <label for="item-desc">商品描述</label>
                    <textarea id="item-desc" required placeholder="输入商品描述"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="item-price">价格（番茄币）</label>
                        <input type="number" id="item-price" required min="1" placeholder="价格" />
                    </div>
                    <div class="form-group">
                        <label for="item-icon">图标</label>
                        <select id="item-icon" required>
                            <option value="fas fa-coffee">☕ 咖啡</option>
                            <option value="fas fa-music">🎵 音乐</option>
                            <option value="fas fa-book">📚 书籍</option>
                            <option value="fas fa-gamepad">🎮 游戏</option>
                            <option value="fas fa-headphones">🎧 耳机</option>
                            <option value="fas fa-lightbulb">💡 灯泡</option>
                            <option value="fas fa-pizza-slice">🍕 披萨</option>
                            <option value="fas fa-crown">👑 王冠</option>
                            <option value="fas fa-camera">📷 相机</option>
                            <option value="fas fa-box">📦 箱子</option>
                            <option value="fas fa-microchip">💻 芯片</option>
                            <option value="fas fa-bolt">⚡ 闪电</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="item-effect">效果</label>
                        <select id="item-effect" required>
                            <option value="rest">🛌 休息时间增加</option>
                            <option value="focus">🎯 专注时间增加</option>
                            <option value="tomato">🍅 番茄币奖励</option>
                            <option value="exp">⭐ 经验值奖励</option>
                            <option value="lootbox">🎁 开箱随机奖励</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="item-deps">依赖物品 (ID，逗号分隔)</label>
                        <input type="text" id="item-deps" placeholder="例如: u_123, u_456" />
                        <div style="font-size:0.75rem;color:var(--gray);margin-top:4px;">输入依赖的物品ID，使用前需拥有这些物品</div>
