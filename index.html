                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="btn-submit-form">
                        <i class="fas fa-save"></i> <span id="submit-btn-text">创建商品</span>
                    </button>
                    <button type="button" class="btn btn-gold" id="btn-export-single">
                        <i class="fas fa-file-export"></i> 创建物品文件
                    </button>
                    <button type="button" class="btn btn-gold" id="btn-export-and-load">
                        <i class="fas fa-file-import"></i> 创建并加载
                    </button>
                </div>
                <div style="margin-top:12px;font-size:0.85rem;color:var(--gray);">
                    <i class="fas fa-info-circle"></i> “开箱”效果使用时会随机获得奖励。
                </div>
            </form>
        </section>

        <!-- ===== 统计 ===== -->
        <section class="panel content-section" id="stats-section">
            <div class="panel-header">
                <h2 class="panel-title"><i class="fas fa-chart-line"></i> 数据统计</h2>
            </div>
            <div class="tab-container">
                <div class="tab active" data-tab="daily">📅 今日</div>
                <div class="tab" data-tab="weekly">📆 本周</div>
                <div class="tab" data-tab="monthly">📊 本月</div>
            </div>
            <div class="tab-content active" id="daily-stats"></div>
            <div class="tab-content" id="weekly-stats"></div>
            <div class="tab-content" id="monthly-stats"></div>
        </section>
    </main>

    <!-- ===== 通知 ===== -->
    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i>
        <span id="notification-text">消息</span>
    </div>

    <!-- ============================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // =========================================================
            //  数据层（包含 tasks）
            // =========================================================
            const STORAGE_KEY = 'tomato_data_v3';

            function getDefaultData() {
                return {
                    tomatoes: 0,
                    exp: 0,
                    level: 1,
                    backpack: {},
                    userItems: [],
                    tasks: [], // 任务数组
                    history: [],
                    stats: { daily: { tomatoes: 0, exp: 0, sessions: 0 }, weekly: { tomatoes: 0, exp: 0,
                            sessions: 0 }, monthly: { tomatoes: 0, exp: 0, sessions: 0 } }
                };
            }

            let data = loadData();

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        const def = getDefaultData();
                        for (const key in def) { if (!(key in parsed)) parsed[key] = def[key]; }
                        // 确保每个任务有 dependencies 字段
                        if (parsed.tasks) {
                            parsed.tasks.forEach(t => { if (!t.dependencies) t.dependencies = []; });
                        }
                        return parsed;
                    }
                } catch (_) {}
                return getDefaultData();
            }

            function saveData() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
            }

            // =========================================================
            //  预设商品
            // =========================================================
            const PRESET_ITEMS = [
                { id: 'p1', name: '休息 5 分钟', price: 1, icon: 'fas fa-coffee', effect: 'rest',
                desc: '增加 5 分钟休息时间', dependencies: [] },
                { id: 'p2', name: '专注加成', price: 2, icon: 'fas fa-brain', effect: 'focus',
                desc: '下次专注 +10 分钟', dependencies: [] },
                { id: 'p3', name: '双倍奖励', price: 5, icon: 'fas fa-gem', effect: 'tomato',
                desc: '下次番茄币 x2', dependencies: [] },
                { id: 'p4', name: '经验加成', price: 3, icon: 'fas fa-star', effect: 'exp',
                desc: '获得 25% 额外经验', dependencies: [] },
                { id: 'p5', name: '惊喜宝箱', price: 8, icon: 'fas fa-box', effect: 'lootbox',
                    desc: '开箱获得随机奖励！', dependencies: [] },
                { id: 'p6', name: '高级特权', price: 30, icon: 'fas fa-crown', effect: 'premium',
                    desc: '解锁所有功能', dependencies: [] }
            ];

            function getAllItems() {
                return [...PRESET_ITEMS, ...data.userItems];
            }

            function findItem(id) {
                return getAllItems().find(item => String(item.id) === String(id));
            }

            // =========================================================
            //  DOM 引用
            // =========================================================
            const $ = id => document.getElementById(id);
            const timerDisplay = $('timer-display');
            const progressBar = $('progress-bar');
            const statusMsg = $('status');
            const tomatoCounter = $('tomato-counter');
            const expCounter = $('exp-counter');
            const levelCounter = $('level-counter');
            const btnStart = $('btn-start');
            const btnPause = $('btn-pause');
            const btnReset = $('btn-reset');
            const storeItemsEl = $('store-items');
            const backpackItemsEl = $('backpack-items');
            const notification = $('notification');
            const notificationText = $('notification-text');
            const itemForm = $('item-form');
            const durationInput = $('duration-input');
            const createPanelTitle = $('create-panel-title');
            const editBadge = $('edit-badge');
            const cancelEditBtn = $('btn-cancel-edit');
            const submitBtnText = $('submit-btn-text');
            const btnSubmitForm = $('btn-submit-form');
            const btnExportSingle = $('btn-export-single');
            const btnExportAndLoad = $('btn-export-and-load');

            // 任务相关 DOM
            const taskListContainer = $('task-list-container');
            const taskFormContainer = $('task-form-container');
            const taskForm = $('task-form');
            const btnAddTask = $('btn-add-task');
            const btnTaskSubmit = $('btn-task-submit');
            const btnTaskCancel = $('btn-task-cancel');
            const taskNameInput = $('task-name');
            const taskDescInput = $('task-desc');
            const taskTargetInput = $('task-target');
            const taskRewardType = $('task-reward-type');
            const taskRewardAmount = $('task-reward-amount');
            const taskRewardItem = $('task-reward-item');
            const taskRewardItemGroup = $('task-reward-item-group');
            const taskDepsInput = $('task-deps');

            let editingTaskId = null;

            // =========================================================
            //  编辑状态（商品）
            // =========================================================
            let editingItemId = null;

            function startEditing(itemId) {
                const item = data.userItems.find(i => String(i.id) === String(itemId));
                if (!item) return showNotification('商品不存在', 'error');
                editingItemId = String(itemId);
                $('item-name').value = item.name;
                $('item-desc').value = item.desc || '';
                $('item-price').value = item.price;
                $('item-icon').value = item.icon;
                $('item-effect').value = item.effect;
                $('item-deps').value = (item.dependencies || []).join(', ');
                editBadge.style.display = 'inline';
                cancelEditBtn.style.display = 'inline-block';
                submitBtnText.textContent = '更新商品';
                createPanelTitle.innerHTML =
                    `<i class="fas fa-edit"></i> 编辑商品 <span id="edit-badge" class="edit-badge" style="display:inline;">编辑中</span>`;
                switchSection('create');
                showNotification(`✏️ 正在编辑「${item.name}」`, 'warning');
            }

            function cancelEditing() {
                editingItemId = null;
                editBadge.style.display = 'none';
                cancelEditBtn.style.display = 'none';
                submitBtnText.textContent = '创建商品';
                createPanelTitle.innerHTML = `<i class="fas fa-plus-circle"></i> 创建商品`;
                itemForm.reset();
                $('item-deps').value = '';
            }
            cancelEditBtn.addEventListener('click', cancelEditing);

            // =========================================================
            //  计时器
            // =========================================================
            let WORK_TIME = 25 * 60;
            let timeLeft = WORK_TIME;
            let timerInterval = null;
            let isRunning = false;
            let isPaused = false;

            function updateStatsUI() {
                tomatoCounter.textContent = data.tomatoes;
                const expNeeded = data.level * 100;
                expCounter.textContent = `${data.exp} / ${expNeeded}`;
                levelCounter.textContent = data.level;
            }

            function updateTimerDisplay() {
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }

            function updateProgress() {
                const total = WORK_TIME;
                const progress = ((total - timeLeft) / total) * 100;
                progressBar.style.width = `${Math.min(100, progress)}%`;
            }

            function updateStatus(text) { statusMsg.textContent = text; }

            function setButtons(running, paused) {
                btnStart.disabled = running || paused;
                btnPause.disabled = !running || paused;
                btnReset.disabled = !running && !paused;
                if (paused) btnStart.disabled = false;
            }

            durationInput.addEventListener('change', function() {
                let val = parseInt(this.value);
                if (isNaN(val) || val < 1) val = 1;
                if (val > 99) val = 99;
                this.value = val;
                WORK_TIME = val * 60;
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                isPaused = false;
                timeLeft = WORK_TIME;
                updateTimerDisplay();
                updateProgress();
                setButtons(false, false);
                updateStatus('⏱️ 时长已更新');
            });

            function startTimer() {
                if (isRunning && !isPaused) return;
                if (timeLeft <= 0) { resetTimer(); return; }
                isRunning = true;
                isPaused = false;
                setButtons(true, false);
                updateStatus('🍅 专注工作中…');
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    updateProgress();
                    if (timeLeft <= 0) completeTimer();
                }, 1000);
            }

            function pauseTimer() {
                if (!isRunning || isPaused) return;
                isPaused = true;
                clearInterval(timerInterval);
                timerInterval = null;
                setButtons(true, true);
                updateStatus('⏸️ 已暂停');
            }

            function resetTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                isPaused = false;
                timeLeft = WORK_TIME;
                updateTimerDisplay();
                updateProgress();
                setButtons(false, false);
                updateStatus('🍅 准备开始工作吧！');
            }

            function completeTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                isPaused = false;
                setButtons(false, false);
                const earnedTomato = 1,
                    earnedExp = 10;
                data.tomatoes += earnedTomato;
                data.exp += earnedExp;
                data.history.push({ date: new Date().toISOString(), tomatoesEarned: earnedTomato, expEarned: earnedExp });
                checkLevelUp();
                // 更新任务进度
                updateTaskProgress();
                saveData();
                updateStatsUI();
                updateStatus('🎉 完成！获得 1 🍅 + 10 ⭐');
                showNotification('🎉 完成一个番茄！获得 1 番茄币和 10 经验值', 'success');
                timeLeft = WORK_TIME;
                updateTimerDisplay();
                updateProgress();
                if (document.getElementById('stats-section').classList.contains('active')) renderStats();
                if (document.getElementById('tasks-section').classList.contains('active')) renderTasks();
            }

            function checkLevelUp() {
                let needed = data.level * 100;
                while (data.exp >= needed) {
                    data.exp -= needed;
                    data.level++;
                    showNotification(`🎊 升级！当前等级 ${data.level}`, 'success');
                    needed = data.level * 100;
                }
                if (data.exp >= data.level * 100) checkLevelUp();
            }

            // =========================================================
            //  依赖检查工具
            // =========================================================
            function checkDependencies(depIds) {
                if (!depIds || depIds.length === 0) return { ok: true, missing: [] };
                const missing = [];
                for (const id of depIds) {
                    const key = String(id).trim();
                    if (!key) continue;
                    if (!data.backpack[key] || data.backpack[key].count <= 0) {
                        missing.push(key);
                    }
                }
                return { ok: missing.length === 0, missing };
            }

            function getDependencyNames(depIds) {
                return depIds.map(id => {
                    const item = findItem(id);
                    return item ? item.name : id;
                });
            }

            // =========================================================
            //  任务系统
            // =========================================================
            function getTaskStatus(task) {
                if (task.completed) return 'done';
                // 检查依赖
                const depCheck = checkDependencies(task.dependencies || []);
                if (!depCheck.ok) return 'locked';
                return 'pending';
            }

            function updateTaskProgress() {
                // 所有进行中的任务，增加完成次数
                data.tasks.forEach(task => {
                    if (task.completed) return;
                    const status = getTaskStatus(task);
                    if (status === 'pending') {
                        task.completedSessions = (task.completedSessions || 0) + 1;
                        if (task.completedSessions >= task.targetSessions) {
                            task.completed = true;
                            // 发放奖励
                            giveTaskReward(task);
                        }
                    }
                });
                saveData();
            }

            function giveTaskReward(task) {
                const rewardType = task.rewardType;
                const amount = task.rewardAmount || 1;
                let msg = '';
                switch (rewardType) {
                    case 'tomato':
                        data.tomatoes += amount;
                        msg = `🍅 获得 ${amount} 番茄币`;
                        break;
                    case 'exp':
                        data.exp += amount;
                        checkLevelUp();
                        msg = `⭐ 获得 ${amount} 经验值`;
                        break;
                    case 'item':
                        const itemId = task.rewardItemId;
                        if (itemId) {
                            const item = findItem(itemId);
                            if (item) {
                                const key = String(item.id);
                                if (data.backpack[key]) {
                                    data.backpack[key].count += amount;
                                } else {
                                    data.backpack[key] = { id: item.id, name: item.name, icon: item.icon,
                                        effect: item.effect, count: amount, dependencies: item.dependencies ||
                                        [] };
                                }
                                msg = `🎁 获得 ${amount} 个「${item.name}」`;
                            } else {
                                msg = `⚠️ 奖励物品不存在 (ID: ${itemId})`;
                            }
                        } else {
                            msg = '⚠️ 未指定奖励物品';
                        }
                        break;
                    case 'lootbox':
                        const result = openLootbox();
                        if (result.type === 'tomato') {
                            data.tomatoes += result.amount;
                            msg = `🍅 开箱获得 ${result.amount} 番茄币！`;
                        } else if (result.type === 'exp') {
                            data.exp += result.amount;
                            checkLevelUp();
                            msg = `⭐ 开箱获得 ${result.amount} 经验值！`;
                        } else {
                            msg = '😅 宝箱是空的…';
                        }
                        break;
                    default:
                        msg = '✅ 任务完成！';
                }
                saveData();
                updateStatsUI();
                showNotification(`🎉 任务「${task.name}」完成！${msg}`, 'success');
                // 重新渲染任务列表
                if (document.getElementById('tasks-section').classList.contains('active')) renderTasks();
                // 刷新商店和背包（因为可能有物品变化）
                if (document.getElementById('store-section').classList.contains('active')) renderStore();
                if (document.getElementById('backpack-section').classList.contains('active')) renderBackpack();
            }

            function openLootbox() {
                const rewards = [
                    { type: 'tomato', amount: 2, label: '2 🍅 番茄币', weight: 30 },
                    { type: 'tomato', amount: 5, label: '5 🍅 番茄币', weight: 15 },
                    { type: 'exp', amount: 10, label: '10 ⭐ 经验值', weight: 25 },
                    { type: 'exp', amount: 25, label: '25 ⭐ 经验值', weight: 10 },
                    { type: 'nothing', label: '😅 什么也没有…', weight: 20 },
                ];
                const totalWeight = rewards.reduce((s, r) => s + r.weight, 0);
                let roll = Math.random() * totalWeight;
                for (const r of rewards) {
                    roll -= r.weight;
                    if (roll <= 0) return r;
                }
                return rewards[0];
            }

            function renderTasks() {
                taskListContainer.innerHTML = '';
                if (data.tasks.length === 0) {
                    taskListContainer.innerHTML =
                        `<div class="empty-message"><i class="fas fa-tasks"></i> 暂无任务，点击“新建任务”创建</div>`;
                    return;
                }
                data.tasks.forEach(task => {
                    const status = getTaskStatus(task);
                    const isCompleted = task.completed || false;
                    const progress = Math.min(100, ((task.completedSessions || 0) / task.targetSessions) * 100);
                    const div = document.createElement('div');
                    div.className = `task-item ${isCompleted ? 'completed' : ''}`;

                    let statusText = '';
                    let statusClass = '';
                    if (isCompleted) {
                        statusText = '✅ 已完成';
                        statusClass = 'done';
                    } else if (status === 'locked') {
                        statusText = '🔒 缺依赖';
                        statusClass = 'locked';
                    } else {
                        statusText = '🔄 进行中';
                        statusClass = 'pending';
                    }

                    const depNames = (task.dependencies || []).length > 0 ? getDependencyNames(task.dependencies || [])
                        .join(' → ') : '无';

                    let rewardDesc = '';
                    switch (task.rewardType) {
                        case 'tomato':
                            rewardDesc = `🍅 ${task.rewardAmount} 番茄币`;
                            break;
                        case 'exp':
                            rewardDesc = `⭐ ${task.rewardAmount} 经验值`;
                            break;
                        case 'item':
                            const item = findItem(task.rewardItemId);
                            rewardDesc = `🎁 ${item ? item.name : '未知物品'} x${task.rewardAmount}`;
                            break;
                        case 'lootbox':
                            rewardDesc = '🎁 开箱';
                            break;
                        default:
                            rewardDesc = '无奖励';
                    }

                    div.innerHTML = `
                        <div class="task-header">
                            <span class="task-name">${task.name}</span>
                            <span class="task-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="task-desc">${task.description || ''}</div>
                        <div class="task-reward">🏆 奖励：${rewardDesc}</div>
                        <div class="task-progress">
                            <span style="font-size:0.8rem;color:var(--gray);">${task.completedSessions || 0}/${task.targetSessions}</span>
                            <div class="task-bar"><div class="task-fill" style="width:${progress}%;"></div></div>
                        </div>
                        <div style="font-size:0.75rem;color:var(--gray);">📦 依赖：${depNames}</div>
                        <div class="task-actions">
                            <button class="btn btn-secondary btn-sm task-edit" data-id="${task.id}"><i class="fas fa-pen"></i> 编辑</button>
                            <button class="btn btn-danger btn-sm task-delete" data-id="${task.id}"><i class="fas fa-trash"></i> 删除</button>
                            ${isCompleted ? `<button class="btn btn-outline btn-sm task-reset" data-id="${task.id}"><i class="fas fa-undo"></i> 重置</button>` : ''}
                        </div>
                    `;
                    taskListContainer.appendChild(div);

                    // 编辑
                    div.querySelector('.task-edit').addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        editTask(id);
                    });
                    // 删除
                    div.querySelector('.task-delete').addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        if (confirm('确定删除此任务吗？')) deleteTask(id);
                    });
                    // 重置
                    const resetBtn = div.querySelector('.task-reset');
                    if (resetBtn) {
                        resetBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const id = this.dataset.id;
                            resetTask(id);
                        });
                    }
                });
            }

            // 任务 CRUD
            function addTask(taskData) {
                const newTask = {
                    id: 't_' + Date.now(),
                    name: taskData.name,
                    description: taskData.description || '',
                    targetSessions: taskData.targetSessions,
                    completedSessions: 0,
                    completed: false,
                    rewardType: taskData.rewardType,
                    rewardAmount: taskData.rewardAmount || 1,
                    rewardItemId: taskData.rewardItemId || null,
                    dependencies: taskData.dependencies || []
                };
                data.tasks.push(newTask);
                saveData();
                renderTasks();
                showNotification(`✅ 任务「${newTask.name}」已创建`, 'success');
            }

            function editTask(id) {
                const task = data.tasks.find(t => t.id === id);
                if (!task) return showNotification('任务不存在', 'error');
                editingTaskId = id;
                taskNameInput.value = task.name;
                taskDescInput.value = task.description || '';
                taskTargetInput.value = task.targetSessions;
                taskRewardType.value = task.rewardType;
                taskRewardAmount.value = task.rewardAmount || 1;
                taskRewardItem.value = task.rewardItemId || '';
                taskDepsInput.value = (task.dependencies || []).join(', ');
                // 显示奖励物品输入框
                toggleRewardItemInput(task.rewardType === 'item');
                btnTaskSubmit.textContent = '更新任务';
                taskFormContainer.style.display = 'block';
                btnAddTask.style.display = 'none';
                // 滚动到表单
                taskFormContainer.scrollIntoView({ behavior: 'smooth' });
            }

            function deleteTask(id) {
                data.tasks = data.tasks.filter(t => t.id !== id);
                saveData();
                renderTasks();
                showNotification('🗑️ 任务已删除', 'warning');
                if (editingTaskId === id) cancelTaskEdit();
            }

            function resetTask(id) {
                const task = data.tasks.find(t => t.id === id);
                if (!task) return;
                task.completed = false;
                task.completedSessions = 0;
                saveData();
                renderTasks();
                showNotification(`🔄 任务「${task.name}」已重置`, 'success');
            }

            function cancelTaskEdit() {
                editingTaskId = null;
                taskFormContainer.style.display = 'none';
                btnAddTask.style.display = 'inline-block';
                btnTaskSubmit.textContent = '保存任务';
                taskForm.reset();
                taskRewardItem.value = '';
                toggleRewardItemInput(false);
            }

            function toggleRewardItemInput(show) {
                taskRewardItemGroup.style.display = show ? 'block' : 'none';
            }

            // 监听奖励类型切换
            taskRewardType.addEventListener('change', function() {
                toggleRewardItemInput(this.value === 'item');
            });

            // 任务表单提交
            taskForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const name = taskNameInput.value.trim();
                const description = taskDescInput.value.trim();
                const targetSessions = parseInt(taskTargetInput.value);
                const rewardType = taskRewardType.value;
                const rewardAmount = parseInt(taskRewardAmount.value) || 1;
                const rewardItemId = taskRewardItem.value.trim() || null;
                const depsRaw = taskDepsInput.value.trim();
                const dependencies = depsRaw ? depsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

                if (!name || isNaN(targetSessions) || targetSessions < 1) {
                    return showNotification('请正确填写任务名称和目标次数', 'error');
                }

                // 验证依赖是否存在
                for (const depId of dependencies) {
                    if (!findItem(depId)) {
                        return showNotification(`依赖物品 "${depId}" 不存在，请先创建`, 'warning');
                    }
                }

                // 验证奖励物品
                if (rewardType === 'item' && rewardItemId) {
                    if (!findItem(rewardItemId)) {
                        return showNotification(`奖励物品 "${rewardItemId}" 不存在`, 'error');
                    }
                }

                const taskData = {
                    name,
                    description,
                    targetSessions,
                    rewardType,
                    rewardAmount,
                    rewardItemId: rewardType === 'item' ? rewardItemId : null,
                    dependencies
                };

                if (editingTaskId) {
                    // 更新
                    const idx = data.tasks.findIndex(t => t.id === editingTaskId);
                    if (idx !== -1) {
                        const old = data.tasks[idx];
                        // 保留完成状态和已计数
                        data.tasks[idx] = {
                            ...old,
                            name: taskData.name,
                            description: taskData.description,
                            targetSessions: taskData.targetSessions,
                            rewardType: taskData.rewardType,
                            rewardAmount: taskData.rewardAmount,
                            rewardItemId: taskData.rewardItemId,
                            dependencies: taskData.dependencies,
                            // 如果目标次数改变，重置进度？
                            // 保持原进度，但若已完成则保留完成状态
                        };
                        // 如果已完成，但目标次数改变，可能需要重置？
                        // 简单处理：如果原任务已完成，不重置
                        saveData();
                        renderTasks();
                        showNotification(`✅ 任务「${taskData.name}」已更新`, 'success');
                        cancelTaskEdit();
                    } else {
                        showNotification('任务不存在', 'error');
                    }
                } else {
                    addTask(taskData);
                    cancelTaskEdit();
                }
            });

            btnAddTask.addEventListener('click', function() {
                taskFormContainer.style.display = 'block';
                btnAddTask.style.display = 'none';
                taskForm.reset();
                editingTaskId = null;
                btnTaskSubmit.textContent = '保存任务';
                toggleRewardItemInput(false);
                taskFormContainer.scrollIntoView({ behavior: 'smooth' });
            });

            btnTaskCancel.addEventListener('click', function() {
                cancelTaskEdit();
            });

            // =========================================================
            //  商店渲染（含依赖显示）
            // =========================================================
            function renderStore() {
                const items = getAllItems();
                storeItemsEl.innerHTML = '';
                if (items.length === 0) {
                    storeItemsEl.innerHTML = `<div class="empty-message"><i class="fas fa-store"></i> 商店暂无商品</div>`;
                    return;
                }
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    const canBuy = data.tomatoes >= item.price;
                    const isUserItem = String(item.id).startsWith('u_');
                    const deps = item.dependencies || [];
                    const depCheck = checkDependencies(deps);
                    const hasDeps = deps.length > 0;

                    let depHTML = '';
                    if (hasDeps) {
                        const depNames = getDependencyNames(deps);
                        const statusClass = depCheck.ok ? 'dep-ok' : 'dep-miss';
                        const statusText = depCheck.ok ? '✅ 依赖满足' : '❌ 缺依赖';
                        depHTML = `
                            <div class="dep-list">📦 依赖: ${depNames.join(' → ')}</div>
                            <span class="dependency-badge ${statusClass}">${statusText}</span>
                        `;
                    }

                    let actionsHTML = `
                        <button class="btn btn-accent btn-buy" data-id="${item.id}" ${canBuy ? '' : 'disabled'}>
                            ${canBuy ? '购买' : '余额不足'}
                        </button>
                    `;
                    if (isUserItem) {
                        actionsHTML += `
                            <button class="btn btn-secondary btn-sm btn-edit" data-id="${item.id}" title="编辑"><i class="fas fa-pen"></i></button>
                            <button class="btn btn-danger btn-sm btn-remove" data-id="${item.id}" title="移除"><i class="fas fa-trash"></i></button>
                        `;
                    }

                    div.innerHTML = `
                        <div class="item-icon"><i class="${item.icon}"></i></div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-desc">${item.desc || ' '}</div>
                        <div class="item-price">${item.price} 🍅</div>
                        ${depHTML}
                        <div class="item-actions">${actionsHTML}</div>
                    `;
                    storeItemsEl.appendChild(div);

                    div.querySelector('.btn-buy').addEventListener('click', function(e) {
                        e.stopPropagation();
                        purchaseItem(this.dataset.id);
                    });
                    const editBtn = div.querySelector('.btn-edit');
                    if (editBtn) editBtn.addEventListener('click', function(e) { e.stopPropagation();
                        startEditing(this.dataset.id); });
                    const removeBtn = div.querySelector('.btn-remove');
                    if (removeBtn) removeBtn.addEventListener('click', function(e) { e.stopPropagation();
                        removeUserItem(this.dataset.id); });
                });
            }

            function purchaseItem(itemId) {
                const item = findItem(itemId);
                if (!item) return showNotification('商品不存在', 'error');
                if (data.tomatoes < item.price) return showNotification('番茄币不足！', 'error');
                data.tomatoes -= item.price;
                const key = String(item.id);
                if (data.backpack[key]) {
                    data.backpack[key].count++;
                } else {
                    data.backpack[key] = { id: item.id, name: item.name, icon: item.icon, effect: item.effect,
                        count: 1, dependencies: item.dependencies || [] };
                }
                saveData();
                updateStatsUI();
                renderStore();
                renderBackpack();
                showNotification(`✅ 购买了「${item.name}」`, 'success');
            }

            function removeUserItem(itemId) {
                const idx = data.userItems.findIndex(i => String(i.id) === String(itemId));
                if (idx === -1) return showNotification('无法移除默认商品', 'error');
                const removed = data.userItems.splice(idx, 1)[0];
                const key = String(itemId);
                if (data.backpack[key]) delete data.backpack[key];
                saveData();
                renderStore();
                renderBackpack();
                if (editingItemId === String(itemId)) cancelEditing();
                showNotification(`🗑️ 已移除「${removed.name}」`, 'warning');
            }

            // =========================================================
            //  背包渲染
            // =========================================================
            function renderBackpack() {
                const keys = Object.keys(data.backpack);
                backpackItemsEl.innerHTML = '';
                if (keys.length === 0) {
                    backpackItemsEl.innerHTML =
                        `<div class="empty-message"><i class="fas fa-backpack"></i> 背包空空，去商店逛逛吧</div>`;
                    return;
                }
                keys.forEach(key => {
                    const item = data.backpack[key];
                    const fullItem = findItem(key);
                    const deps = fullItem ? (fullItem.dependencies || []) : (item.dependencies || []);
                    const depCheck = checkDependencies(deps);

                    const div = document.createElement('div');
                    div.className = 'backpack-item';

                    let depStatus = '';
                    if (deps.length > 0) {
                        const depNames = getDependencyNames(deps);
                        const cls = depCheck.ok ? 'dep-ok' : 'dep-miss';
                        const txt = depCheck.ok ? '✅' : '❌';
                        depStatus = `<div style="font-size:0.65rem;color:var(--gray);">${txt} ${depNames.join(' → ')}</div>`;
                    }

                    const canUse = depCheck.ok;

                    div.innerHTML = `
                        <div class="item-count">${item.count}</div>
                        <div class="item-icon"><i class="${item.icon}"></i></div>
                        <div class="item-name">${item.name}</div>
                        ${depStatus}
                        <button class="btn ${canUse ? 'btn-primary' : 'btn-outline'} btn-use" data-id="${key}" ${canUse ? '' : 'disabled'}>
                            ${canUse ? '使用' : '缺依赖'}
                        </button>
                    `;
                    backpackItemsEl.appendChild(div);
                    div.querySelector('.btn-use').addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (!canUse) {
                            const miss = depCheck.missing.map(id => findItem(id)?.name || id).join(', ');
                            showNotification(`❌ 缺少依赖物品: ${miss}`, 'error');
                            return;
                        }
                        useItem(key);
                    });
                });
            }

            function useItem(itemId) {
                const item = data.backpack[itemId];
                if (!item || item.count <= 0) return;
                const fullItem = findItem(itemId);
                const deps = fullItem ? (fullItem.dependencies || []) : (item.dependencies || []);
                const depCheck = checkDependencies(deps);
                if (!depCheck.ok) {
                    const miss = depCheck.missing.map(id => findItem(id)?.name || id).join(', ');
                    showNotification(`❌ 缺少依赖物品: ${miss}`, 'error');
                    return;
                }
                const effect = item.effect || (fullItem ? fullItem.effect : 'rest');
                if (effect === 'lootbox') {
                    const result = openLootbox();
                    let msg = '';
                    if (result.type === 'tomato') {
                        data.tomatoes += result.amount;
                        msg = `🍅 获得 ${result.amount} 番茄币！`;
                    } else if (result.type === 'exp') {
                        data.exp += result.amount;
                        checkLevelUp();
                        msg = `⭐ 获得 ${result.amount} 经验值！`;
                    } else {
                        msg = '😅 宝箱是空的…';
                    }
                    item.count--;
                    if (item.count <= 0) delete data.backpack[itemId];
                    saveData();
                    updateStatsUI();
                    renderBackpack();
                    renderStore();
                    showNotification(`🎁 ${msg}`, 'success');
                    return;
                }
                applyEffect(item);
                item.count--;
                if (item.count <= 0) delete data.backpack[itemId];
                saveData();
                updateStatsUI();
                renderBackpack();
                renderStore();
            }

            function applyEffect(item) {
                const effect = item.effect;
                switch (effect) {
                    case 'rest':
                        timeLeft = Math.max(timeLeft, 5 * 60);
                        updateTimerDisplay();
                        updateProgress();
                        updateStatus('🛌 休息 5 分钟');
                        showNotification('☕ 已使用休息时间', 'success');
                        break;
                    case 'focus':
                        timeLeft = Math.min(timeLeft + 10 * 60, 45 * 60);
                        updateTimerDisplay();
                        updateProgress();
                        updateStatus('🎯 专注时间 +10 分钟');
                        showNotification('🎯 专注时间增加 10 分钟', 'success');
                        break;
                    case 'tomato':
                        data.tomatoes += 2;
                        saveData();
                        updateStatsUI();
                        showNotification('🍅 获得 2 番茄币！', 'success');
                        break;
                    case 'exp':
                        data.exp += 25;
                        checkLevelUp();
                        saveData();
                        updateStatsUI();
                        showNotification('⭐ 获得 25 经验值！', 'success');
                        break;
                    default:
                        showNotification(`使用了「${item.name}」`, 'success');
                }
            }

            // =========================================================
            //  创建 / 更新商品（含 dependencies）
            // =========================================================
            function getFormData() {
                const depsRaw = $('item-deps').value.trim();
                const deps = depsRaw ? depsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
                return {
                    name: $('item-name').value.trim(),
                    desc: $('item-desc').value.trim(),
                    price: parseInt($('item-price').value),
                    icon: $('item-icon').value,
                    effect: $('item-effect').value,
                    dependencies: deps
                };
            }

            function validateForm(data) {
                if (!data.name || !data.desc || isNaN(data.price) || data.price < 1) {
                    showNotification('请完整填写表单', 'error');
                    return false;
                }
                for (const depId of data.dependencies) {
                    if (!findItem(depId)) {
                        showNotification(`⚠️ 依赖物品 ID "${depId}" 不存在，请先创建它`, 'warning');
                        return false;
                    }
                }
                return true;
            }

            function saveItemFromForm() {
                const formData = getFormData();
                if (!validateForm(formData)) return null;

                if (editingItemId) {
                    const index = data.userItems.findIndex(i => String(i.id) === editingItemId);
                    if (index === -1) { showNotification('要编辑的商品已不存在', 'error');
                        cancelEditing(); return null; }
                    const oldItem = data.userItems[index];
                    const updated = { ...oldItem, ...formData };
                    data.userItems[index] = updated;
                    const key = editingItemId;
                    if (data.backpack[key]) {
                        data.backpack[key].name = updated.name;
                        data.backpack[key].icon = updated.icon;
                        data.backpack[key].effect = updated.effect;
                        data.backpack[key].dependencies = updated.dependencies;
                    }
                    saveData();
                    showNotification(`✅ 已更新「${updated.name}」`, 'success');
                    cancelEditing();
                    return updated;
                } else {
                    const newItem = { id: 'u_' + Date.now(), ...formData };
                    data.userItems.push(newItem);
                    saveData();
                    showNotification(`✅ 创建商品「${newItem.name}」成功！`, 'success');
                    itemForm.reset();
                    $('item-deps').value = '';
                    return newItem;
                }
            }

            itemForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const saved = saveItemFromForm();
                if (saved) { renderStore();
                    renderBackpack();
                    updateStatsUI(); }
            });

            // =========================================================
            //  导出单个商品
            // =========================================================
            function exportSingleItem(item, filenamePrefix = '商品') {
                const exportData = { userItems: [item], backpack: {}, tasks: [], version: '1.0' };
                const json = JSON.stringify(exportData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const safeName = item.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
                a.download = `${safeName}_${new Date().toISOString().slice(0,10)}.shem`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showNotification(`📄 已导出「${item.name}」为 .shem 文件`, 'success');
            }

            btnExportSingle.addEventListener('click', function() {
                const formData = getFormData();
                if (!validateForm(formData)) return;
                const tempItem = { id: 'temp_' + Date.now(), ...formData };
                exportSingleItem(tempItem, formData.name);
            });

            btnExportAndLoad.addEventListener('click', function() {
                const saved = saveItemFromForm();
                if (saved) {
                    renderStore();
                    renderBackpack();
                    updateStatsUI();
                    exportSingleItem(saved, saved.name);
                    if (!editingItemId) { itemForm.reset();
                        $('item-deps').value = ''; }
                }
            });

            // =========================================================
            //  统计
            // =========================================================
            function renderStats() {
                const dailyEl = $('daily-stats');
                const weeklyEl = $('weekly-stats');
                const monthlyEl = $('monthly-stats');
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const weekStart = new Date(now);
                weekStart.setDate(now.getDate() - now.getDay());
                weekStart.setHours(0, 0, 0, 0);
                const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

                function filterHistory(startDate) {
                    return data.history.filter(h => new Date(h.date) >= startDate);
                }

                function calcStats(records) {
                    let tomatoes = 0,
                        exp = 0,
                        sessions = records.length;
                    records.forEach(r => { tomatoes += r.tomatoesEarned || 0;
                        exp += r.expEarned || 0; });
                    return { tomatoes, exp, sessions };
                }

                function renderStatBlock(el, records, label) {
                    const s = calcStats(records);
                    const expNeeded = data.level * 100;
                    const expProgress = Math.min(100, (data.exp / expNeeded) * 100);
                    el.innerHTML = `
                        <div class="stat-grid">
                            <div class="stat-card"><div class="icon">🍅</div><div class="number">${s.tomatoes}</div><div class="label">番茄币</div></div>
                            <div class="stat-card"><div class="icon">⏱️</div><div class="number">${s.sessions}</div><div class="label">完成番茄</div></div>
                            <div class="stat-card"><div class="icon">⭐</div><div class="number">${s.exp}</div><div class="label">经验值</div></div>
                            <div class="stat-card"><div class="icon">📊</div><div class="number">${data.level}</div><div class="label">当前等级</div></div>
                        </div>
                        <div style="margin-top:8px;">
                            <div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--gray);">
                                <span>等级进度</span><span>${data.exp} / ${expNeeded}</span>
                            </div>
                            <div class="level-bar"><div class="level-progress" style="width:${expProgress}%;"></div></div>
                        </div>
                        <p style="margin-top:12px;font-size:0.85rem;color:var(--gray);">${label} · 共 ${s.sessions} 个番茄</p>
                    `;
                }
                renderStatBlock(dailyEl, filterHistory(today), '今日');
                renderStatBlock(weeklyEl, filterHistory(weekStart), '本周');
                renderStatBlock(monthlyEl, filterHistory(monthStart), '本月');
            }

            // =========================================================
            //  导航
            // =========================================================
            function switchSection(target) {
                document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
                const section = document.getElementById(`${target}-section`);
                if (section) section.classList.add('active');
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const navItem = document.querySelector(`.nav-item[data-target="${target}"]`);
                if (navItem) navItem.classList.add('active');
                if (target === 'stats') renderStats();
                if (target === 'store') renderStore();
                if (target === 'backpack') renderBackpack();
                if (target === 'tasks') renderTasks();
            }
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function() { switchSection(this.dataset.target); });
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const tabId = this.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    const target = document.getElementById(`${tabId}-stats`);
                    if (target) target.classList.add('active');
                });
            });

            // =========================================================
            //  通知
            // =========================================================
            let notiTimer = null;

            function showNotification(text, type = 'success') {
                notificationText.textContent = text;
                notification.className = 'notification show ' + type;
                clearTimeout(notiTimer);
                notiTimer = setTimeout(() => notification.classList.remove('show'), 3500);
            }

            // =========================================================
            //  导入 / 导出 全部（含任务）
            // =========================================================
            const exportBtn = $('btn-export-items');
            const importBtn = $('btn-import-items');
            const fileInput = $('file-input-import');

            exportBtn.addEventListener('click', function() {
                const exportData = {
                    userItems: data.userItems,
                    backpack: data.backpack,
                    tasks: data.tasks,
                    version: '1.0'
                };
                const json = JSON.stringify(exportData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `番茄模组_全量_${new Date().toISOString().slice(0,10)}.shem`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showNotification('✅ 全部数据（含任务）已导出', 'success');
            });

            importBtn.addEventListener('click', function() { fileInput.click(); });

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (imported.userItems && imported.backpack) {
                            let added = 0,
                                updated = 0,
                                bpAdded = 0,
                                bpUpdated = 0;
                            // 合并商品
                            imported.userItems.forEach(imp => {
                                const idx = data.userItems.findIndex(i => String(i.id) === String(imp.id));
                                if (idx !== -1) { data.userItems[idx] = imp;
                                    updated++; } else { data.userItems.push(imp);
                                    added++; }
                            });
                            // 合并背包
                            for (const [key, val] of Object.entries(imported.backpack)) {
                                if (data.backpack[key]) {
                                    data.backpack[key].count += val.count;
                                    data.backpack[key].name = val.name;
                                    data.backpack[key].icon = val.icon;
                                    data.backpack[key].effect = val.effect;
                                    data.backpack[key].dependencies = val.dependencies || [];
                                    bpUpdated++;
                                } else {
                                    data.backpack[key] = val;
                                    bpAdded++;
                                }
                            }
                            // 合并任务
                            let taskAdded = 0;
                            if (imported.tasks) {
                                imported.tasks.forEach(impTask => {
                                    const exists = data.tasks.some(t => t.id === impTask.id);
                                    if (!exists) {
                                        data.tasks.push(impTask);
                                        taskAdded++;
                                    } else {
                                        // 可选的更新逻辑：替换或忽略，这里简单忽略重复
                                    }
                                });
                            }
                            saveData();
                            renderStore();
                            renderBackpack();
                            renderTasks();
                            updateStatsUI();
                            showNotification(
                                `✅ 合并完成：新增 ${added} 个商品，更新 ${updated} 个；背包新增 ${bpAdded} 种，更新 ${bpUpdated} 种；新增 ${taskAdded} 个任务`,
                                'success');
                        } else {
                            showNotification('❌ 无效的 .shem 文件', 'error');
                        }
                    } catch (err) { showNotification('❌ 文件解析失败', 'error');
                        console.error(err); }
                };
                reader.readAsText(file);
                fileInput.value = '';
            });

            // =========================================================
            //  键盘快捷键
            // =========================================================
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')
                    return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (isRunning && !isPaused) pauseTimer();
                    else if (isRunning && isPaused) startTimer();
                    else startTimer();
                }
                if (e.code === 'KeyR' && !e.ctrlKey && !e.metaKey) { e.preventDefault();
                    resetTimer(); }
            });

            // =========================================================
            //  初始化
            // =========================================================
            btnStart.addEventListener('click', startTimer);
            btnPause.addEventListener('click', pauseTimer);
            btnReset.addEventListener('click', resetTimer);
            $('btn-refresh-store').addEventListener('click', renderStore);

            function init() {
                durationInput.value = Math.floor(WORK_TIME / 60);
                updateStatsUI();
                updateTimerDisplay();
                updateProgress();
                setButtons(false, false);
                renderStore();
                renderBackpack();
                renderTasks();
                switchSection('timer');
                renderStats();
                updateStatus('🍅 准备开始工作吧！');
                // 隐藏任务表单初始状态
                taskFormContainer.style.display = 'none';
                btnAddTask.style.display = 'inline-block';
            }
            init();
            console.log('🍅 番茄闹钟 任务模组版 已启动！');
        });
    </script>
</body>
</html>
