<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>个人工作台 · FI0m9ySans</title>
<meta name="description" content="FI0m9ySans 的个人工作台 —— 集成番茄钟、待办、笔记与常用链接。" />
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #14171d;
    --card: #171a21;
    --card-2: #1d212a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --border: #262b34;
    --accent: #ff6b4a;
    --accent-soft: rgba(255, 107, 74, 0.14);
    --good: #4ade80;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    --radius: 14px;
  }
  html[data-theme="light"] {
    --bg: #f4f6f9;
    --bg-soft: #eceff3;
    --card: #ffffff;
    --card-2: #f7f9fb;
    --text: #1a1d23;
    --muted: #5c6675;
    --border: #e3e6ea;
    --accent: #ef5350;
    --accent-soft: rgba(239, 83, 80, 0.12);
    --good: #16a34a;
    --shadow: 0 8px 26px rgba(20, 30, 50, 0.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Hiragino Sans GB", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg), var(--bg-soft));
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    height: 64px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 22px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--card) 80%, transparent);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .brand .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
  }
  .greet { color: var(--muted); font-size: 13px; }
  .clock { margin-left: auto; text-align: right; line-height: 1.15; }
  .clock .time { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; }
  .clock .date { font-size: 12px; color: var(--muted); }
  .icon-btn {
    border: 1px solid var(--border); background: var(--card-2); color: var(--text);
    width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 16px;
    display: grid; place-items: center; transition: .15s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  main {
    height: calc(100vh - 64px);
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 18px;
    padding: 18px 22px;
  }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .clock-wrap { display: flex; flex-direction: column; min-height: 0; }
  .clock-wrap .ph {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px;
  }
  .clock-wrap .ph .tag { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 500; }
  #clockFrame { flex: 1; width: 100%; border: 0; background: var(--bg); min-height: 0; }

  aside { display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 12px 8px; text-align: center; cursor: pointer;
    font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; transition: .15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab:hover { color: var(--text); }
  .tab-body { padding: 16px; overflow-y: auto; flex: 1; }
  .pane { display: none; }
  .pane.active { display: block; }

  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type="text"], textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card-2); color: var(--text); font-size: 14px; outline: none; transition: .15s;
    font-family: inherit;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 200px; line-height: 1.6; }
  .btn {
    border: 0; background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 10px;
    cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; transition: .15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--border); font-weight: 500; }

  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.list li {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    background: var(--card-2); border: 1px solid var(--border); font-size: 14px;
  }
  ul.list li .txt { flex: 1; word-break: break-all; }
  ul.list li.done .txt { text-decoration: line-through; color: var(--muted); }
  .chk { width: 18px; height: 18px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; display: grid; place-items: center; flex: none; }
  .chk.on { background: var(--good); border-color: var(--good); color: #06210f; }
  .x { color: var(--muted); cursor: pointer; border: 0; background: none; font-size: 16px; padding: 2px 4px; }
  .x:hover { color: var(--accent); }
  .links a { color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .links a:hover { color: var(--accent); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }
  .stat { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat .box { flex: 1; background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .stat .box b { font-size: 20px; display: block; }
  .stat .box span { font-size: 11px; color: var(--muted); }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    .clock-wrap { height: 70vh; }
    #clockFrame { min-height: 520px; }
    aside { height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> 个人工作台</div>
  <span class="greet" id="greet">你好，花衫</span>
  <div class="clock">
    <div class="time" id="time">--:--:--</div>
    <div class="date" id="date">----</div>
  </div>
  <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
</header>

<main>
  <section class="panel clock-wrap">
    <div class="ph">🍅 番茄钟 · Mod 版 <span class="tag">内嵌自 tomato.html</span></div>
    <iframe id="clockFrame" src="tomato.html" title="番茄钟 · Mod 版" loading="lazy"></iframe>
  </section>

  <aside class="panel">
    <div class="tabs">
      <div class="tab active" data-pane="todo">待办</div>
      <div class="tab" data-pane="notes">笔记</div>
      <div class="tab" data-pane="links">链接</div>
    </div>
    <div class="tab-body">
      <!-- 待办 -->
      <div class="pane active" id="pane-todo">
        <div class="stat">
          <div class="box"><b id="todoTotal">0</b><span>总任务</span></div>
          <div class="box"><b id="todoDone">0</b><span>已完成</span></div>
        </div>
        <div class="row">
          <input type="text" id="todoInput" placeholder="加个任务，回车添加…" />
          <button class="btn" id="todoAdd">添加</button>
        </div>
        <ul class="list" id="todoList"></ul>
      </div>

      <!-- 笔记 -->
      <div class="pane" id="pane-notes">
        <div class="hint">本地自动保存（localStorage），仅存于本机浏览器。</div>
        <textarea id="notes" placeholder="随手记点什么…"></textarea>
      </div>

      <!-- 链接 -->
      <div class="pane" id="pane-links">
        <div class="row">
          <input type="text" id="linkName" placeholder="名称" />
          <input type="text" id="linkUrl" placeholder="https://…" />
        </div>
        <button class="btn" id="linkAdd" style="width:100%;margin-bottom:12px;">添加链接</button>
        <ul class="list links" id="linkList"></ul>
      </div>
    </div>
  </aside>
</main>

<script>
  // ---------- 主题 ----------
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'light' ? '☀️' : '🌙';
    try { localStorage.setItem('wb_theme', t); } catch (e) {}
  }
  applyTheme((() => { try { return localStorage.getItem('wb_theme') || 'dark'; } catch (e) { return 'dark'; } })());
  themeBtn.onclick = () => applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');

  // ---------- 时钟 ----------
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  const greetEl = document.getElementById('greet');
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  function tick() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    timeEl.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    dateEl.textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 周${WD[d.getDay()]}`;
    const h = d.getHours();
    const g = h < 6 ? '夜深了' : h < 12 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
    greetEl.textContent = `${g}，花衫`;
  }
  tick(); setInterval(tick, 1000);

  // ---------- 标签页 ----------
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('pane-' + t.dataset.pane).classList.add('active');
    };
  });

  // ---------- 待办 ----------
  const todoInput = document.getElementById('todoInput');
  const todoList = document.getElementById('todoList');
  let todos = [];
  try { todos = JSON.parse(localStorage.getItem('wb_todos') || '[]'); } catch (e) {}
  function saveTodos() { try { localStorage.setItem('wb_todos', JSON.stringify(todos)); } catch (e) {} }
  function renderTodos() {
    todoList.innerHTML = '';
    if (!todos.length) { todoList.innerHTML = '<div class="empty">还没有任务，先加一个吧</div>'; }
    todos.forEach((t, i) => {
      const li = document.createElement('li');
      if (t.done) li.classList.add('done');
      const chk = document.createElement('div');
      chk.className = 'chk' + (t.done ? ' on' : '');
      chk.textContent = t.done ? '✓' : '';
      chk.onclick = () => { todos[i].done = !todos[i].done; saveTodos(); renderTodos(); };
      const txt = document.createElement('div');
      txt.className = 'txt'; txt.textContent = t.text;
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '✕';
      x.onclick = () => { todos.splice(i, 1); saveTodos(); renderTodos(); };
      li.append(chk, txt, x);
      todoList.appendChild(li);
    });
    document.getElementById('todoTotal').textContent = todos.length;
    document.getElementById('todoDone').textContent = todos.filter(t => t.done).length;
  }
  function addTodo() {
    const v = todoInput.value.trim();
    if (!v) return;
    todos.push({ text: v, done: false });
    todoInput.value = ''; saveTodos(); renderTodos();
  }
  document.getElementById('todoAdd').onclick = addTodo;
  todoInput.onkeydown = e => { if (e.key === 'Enter') addTodo(); };
  renderTodos();

  // ---------- 笔记 ----------
  const notes = document.getElementById('notes');
  try { notes.value = localStorage.getItem('wb_notes') || ''; } catch (e) {}
  notes.oninput = () => { try { localStorage.setItem('wb_notes', notes.value); } catch (e) {} };

  // ---------- 链接 ----------
  const linkList = document.getElementById('linkList');
  const linkName = document.getElementById('linkName');
  const linkUrl = document.getElementById('linkUrl');
  let links = [];
  try { links = JSON.parse(localStorage.getItem('wb_links') || '[]'); } catch (e) {}
  if (!links.length) {
    links = [
      { name: '番茄钟（独立页）', url: 'tomato.html' },
      { name: 'GitHub 仓库', url: 'https://github.com/FI0m9ySans/fi0m9ysans.github.io' },
      { name: 'Mod 市场 (mods.json)', url: 'mods.json' },
      { name: '使用指南', url: 'guide.html' }
    ];
    saveLinks();
  }
  function saveLinks() { try { localStorage.setItem('wb_links', JSON.stringify(links)); } catch (e) {} }
  function renderLinks() {
    linkList.innerHTML = '';
    if (!links.length) { linkList.innerHTML = '<div class="empty">还没有链接</div>'; }
    links.forEach((l, i) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = '<span>🔗</span><span class="txt"></span>';
      a.querySelector('.txt').textContent = l.name;
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '✕';
      x.onclick = () => { links.splice(i, 1); saveLinks(); renderLinks(); };
      li.append(a, x);
      linkList.appendChild(li);
    });
  }
  function addLink() {
    const n = linkName.value.trim(), u = linkUrl.value.trim();
    if (!n || !u) return;
    links.push({ name: n, url: u });
    linkName.value = ''; linkUrl.value = ''; saveLinks(); renderLinks();
  }
  document.getElementById('linkAdd').onclick = addLink;
  renderLinks();
</script>
</body>
</html>
