        // =========================================================
        //  计时器
        // =========================================================
        let WORK_TIME = 25 * 60;
        let timeLeft = WORK_TIME;
        let timerInterval = null;
        let isRunning = false;
        let isPaused = false;

        function updateStatsUI() {
            tomatoCounter.textContent = data.tomatoes;
            const expNeeded = data.level * 100;
            expCounter.textContent = `${data.exp} / ${expNeeded}`;
            levelCounter.textContent = data.level;
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateProgress() {
            const total = WORK_TIME;
            const progress = ((total - timeLeft) / total) * 100;
            progressBar.style.width = `${Math.min(100, progress)}%`;
        }

        function updateStatus(text) { statusMsg.textContent = text; }

        function setButtons(running, paused) {
            btnStart.disabled = running || paused;
            btnPause.disabled = !running || paused;
            btnReset.disabled = !running && !paused;
            if (paused) btnStart.disabled = false;
        }

        durationInput.addEventListener('change', function() {
            let val = parseInt(this.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 99) val = 99;
            this.value = val;
            WORK_TIME = val * 60;
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            isPaused = false;
            timeLeft = WORK_TIME;
            updateTimerDisplay();
            updateProgress();
            setButtons(false, false);
            updateStatus(t('status-ready'));
        });

        function startTimer() {
            if (isRunning && !isPaused) return;
            if (timeLeft <= 0) { resetTimer(); return; }
            isRunning = true;
            isPaused = false;
            setButtons(true, false);
            updateStatus('🍅 ' + t('status-ready').replace('🍅 ', ''));
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                updateProgress();
                if (timeLeft <= 0) completeTimer();
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning || isPaused) return;
            isPaused = true;
            clearInterval(timerInterval);
            timerInterval = null;
            setButtons(true, true);
            updateStatus('⏸️ ' + t('btn-pause'));
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            isPaused = false;
            timeLeft = WORK_TIME;
            updateTimerDisplay();
            updateProgress();
            setButtons(false, false);
            updateStatus(t('status-ready'));
        }

        function completeTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            isPaused = false;
            setButtons(false, false);
            const earnedTomato = 1,
                earnedExp = 10;
            data.tomatoes += earnedTomato;
            data.exp += earnedExp;
            data.history.push({ date: new Date().toISOString(), tomatoesEarned: earnedTomato, expEarned: earnedExp });
            checkLevelUp();
            updateTaskProgress();
            saveData();
            updateStatsUI();
            updateStatus('🎉 ' + t('notif_complete_tomato'));
            showNotification(t('notif_complete_tomato'), 'success');
            timeLeft = WORK_TIME;
            updateTimerDisplay();
            updateProgress();
            if (document.getElementById('stats-section').classList.contains('active')) renderStats();
            if (document.getElementById('tasks-section').classList.contains('active')) renderTasks();
        }

        function checkLevelUp() {
            let needed = data.level * 100;
            while (data.exp >= needed) {
                data.exp -= needed;
                data.level++;
                showNotification(t('notif_level_up', { level: data.level }), 'success');
                needed = data.level * 100;
            }
            if (data.exp >= data.level * 100) checkLevelUp();
        }

        // =========================================================
        //  依赖检查工具
        // =========================================================
        function checkDependencies(depIds) {
            if (!depIds || depIds.length === 0) return { ok: true, missing: [] };
            const missing = [];
            for (const id of depIds) {
                const key = String(id).trim();
                if (!key) continue;
                if (!data.backpack[key] || data.backpack[key].count <= 0) {
                    missing.push(key);
                }
            }
            return { ok: missing.length === 0, missing };
        }

        function getDependencyNames(depIds) {
            return depIds.map(id => {
                const item = findItem(id);
                return item ? item.name : id;
            });
        }

        // =========================================================
        //  任务系统
        // =========================================================
        function getTaskStatus(task) {
            if (task.completed) return 'done';
            const depCheck = checkDependencies(task.dependencies || []);
            if (!depCheck.ok) return 'locked';
            return 'pending';
        }

        function updateTaskProgress() {
            data.tasks.forEach(task => {
                if (task.completed) return;
                const status = getTaskStatus(task);
                if (status === 'pending') {
                    task.completedSessions = (task.completedSessions || 0) + 1;
                    if (task.completedSessions >= task.targetSessions) {
                        task.completed = true;
                        giveTaskReward(task);
                    }
                }
            });
            saveData();
        }

        function giveTaskReward(task) {
            const rewardType = task.rewardType;
            const amount = task.rewardAmount || 1;
            let msg = '';
            switch (rewardType) {
                case 'tomato':
                    data.tomatoes += amount;
                    msg = t('notif_lootbox_tomato', { amount });
                    break;
                case 'exp':
                    data.exp += amount;
                    checkLevelUp();
                    msg = t('notif_lootbox_exp', { amount });
                    break;
                case 'item':
                    const itemId = task.rewardItemId;
                    if (itemId) {
                        const item = findItem(itemId);
                        if (item) {
                            const key = String(item.id);
                            if (data.backpack[key]) {
                                data.backpack[key].count += amount;
                            } else {
                                data.backpack[key] = { id: item.id, name: item.name, icon: item.icon,
                                    effect: item.effect, count: amount, dependencies: item.dependencies ||
                                    [] };
                            }
                            msg = `🎁 ${t('reward_desc_item', { name: item.name, amount })}`;
                        } else {
                            msg = `⚠️ ${t('notif_error_task_reward_item_missing', { id: itemId })}`;
                        }
                    } else {
                        msg = '⚠️ ' + t('task_no_reward');
                    }
                    break;
                case 'lootbox':
                    const result = openLootbox();
                    if (result.type === 'tomato') {
                        data.tomatoes += result.amount;
                        msg = t('notif_lootbox_tomato', { amount: result.amount });
                    } else if (result.type === 'exp') {
                        data.exp += result.amount;
                        checkLevelUp();
                        msg = t('notif_lootbox_exp', { amount: result.amount });
                    } else {
                        msg = t('notif_lootbox_empty');
                    }
                    break;
                default:
                    msg = '✅ ' + t('task_status_done');
            }
            saveData();
            updateStatsUI();
            showNotification(t('notif_task_complete', { name: task.name, reward_msg: msg }), 'success');
            if (document.getElementById('tasks-section').classList.contains('active')) renderTasks();
            if (document.getElementById('store-section').classList.contains('active')) renderStore();
            if (document.getElementById('backpack-section').classList.contains('active')) renderBackpack();
        }

        function openLootbox() {
            const rewards = [
                { type: 'tomato', amount: 2, label: '2 🍅 ' + t('reward-tomato'), weight: 30 },
                { type: 'tomato', amount: 5, label: '5 🍅 ' + t('reward-tomato'), weight: 15 },
                { type: 'exp', amount: 10, label: '10 ⭐ ' + t('reward-exp'), weight: 25 },
                { type: 'exp', amount: 25, label: '25 ⭐ ' + t('reward-exp'), weight: 10 },
                { type: 'nothing', label: '😅 ' + t('notif_lootbox_empty'), weight: 20 },
            ];
            const totalWeight = rewards.reduce((s, r) => s + r.weight, 0);
            let roll = Math.random() * totalWeight;
            for (const r of rewards) {
                roll -= r.weight;
                if (roll <= 0) return r;
            }
            return rewards[0];
        }

        function renderTasks() {
            taskListContainer.innerHTML = '';
            if (data.tasks.length === 0) {
                taskListContainer.innerHTML =
                    `<div class="empty-message"><i class="fas fa-tasks"></i> ${t('empty_tasks')}</div>`;
                return;
            }
            data.tasks.forEach(task => {
                const status = getTaskStatus(task);
                const isCompleted = task.completed || false;
                const progress = Math.min(100, ((task.completedSessions || 0) / task.targetSessions) * 100);
                const div = document.createElement('div');
                div.className = `task-item ${isCompleted ? 'completed' : ''}`;

                let statusText = '',
                    statusClass = '';
                if (isCompleted) {
                    statusText = t('task_status_done');
                    statusClass = 'done';
                } else if (status === 'locked') {
                    statusText = t('task_status_locked');
                    statusClass = 'locked';
                } else {
                    statusText = t('task_status_pending');
                    statusClass = 'pending';
                }

                const depNames = (task.dependencies || []).length > 0 ? getDependencyNames(task.dependencies || [])
                    .join(' → ') : t('task_no_reward');

                let rewardDesc = '';
                switch (task.rewardType) {
                    case 'tomato':
                        rewardDesc = t('reward_desc_tomato', { amount: task.rewardAmount });
                        break;
                    case 'exp':
                        rewardDesc = t('reward_desc_exp', { amount: task.rewardAmount });
                        break;
                    case 'item':
                        const item = findItem(task.rewardItemId);
                        rewardDesc = t('reward_desc_item', { name: item ? item.name : 'Unknown', amount: task
                                .rewardAmount });
                        break;
                    case 'lootbox':
                        rewardDesc = t('reward_desc_lootbox');
                        break;
                    default:
                        rewardDesc = t('task_no_reward');
                }

                div.innerHTML = `
                    <div class="task-header">
                        <span class="task-name">${task.name}</span>
                        <span class="task-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="task-desc">${task.description || ''}</div>
                    <div class="task-reward">${t('task_reward')}${rewardDesc}</div>
                    <div class="task-progress">
                        <span style="font-size:0.8rem;color:var(--gray);">${task.completedSessions || 0}/${task.targetSessions}</span>
                        <div class="task-bar"><div class="task-fill" style="width:${progress}%;"></div></div>
                    </div>
                    <div style="font-size:0.75rem;color:var(--gray);">📦 ${t('dependencies')}：${depNames}</div>
                    <div class="task-actions">
                        <button class="btn btn-secondary btn-sm task-edit" data-id="${task.id}"><i class="fas fa-pen"></i> ${t('task_edit')}</button>
                        <button class="btn btn-danger btn-sm task-delete" data-id="${task.id}"><i class="fas fa-trash"></i> ${t('task_delete')}</button>
                        ${isCompleted ? `<button class="btn btn-outline btn-sm task-reset" data-id="${task.id}"><i class="fas fa-undo"></i> ${t('task_reset')}</button>` : ''}
                    </div>
                `;
                taskListContainer.appendChild(div);

                div.querySelector('.task-edit').addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    editTask(id);
                });
                div.querySelector('.task-delete').addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    if (confirm(t('task_delete') + '?')) deleteTask(id);
                });
                const resetBtn = div.querySelector('.task-reset');
                if (resetBtn) {
                    resetBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        resetTask(id);
                    });
                }
            });
        }

        function addTask(taskData) {
            const newTask = {
                id: 't_' + Date.now(),
                name: taskData.name,
                description: taskData.description || '',
                targetSessions: taskData.targetSessions,
                completedSessions: 0,
                completed: false,
                rewardType: taskData.rewardType,
                rewardAmount: taskData.rewardAmount || 1,
                rewardItemId: taskData.rewardItemId || null,
                dependencies: taskData.dependencies || []
            };
            data.tasks.push(newTask);
            saveData();
            renderTasks();
            showNotification(t('notif_task_created', { name: newTask.name }), 'success');
        }

        function editTask(id) {
            const task = data.tasks.find(t => t.id === id);
            if (!task) return showNotification(t('notif_error_task_missing'), 'error');
            editingTaskId = id;
            taskNameInput.value = task.name;
            taskDescInput.value = task.description || '';
            taskTargetInput.value = task.targetSessions;
            taskRewardType.value = task.rewardType;
            taskRewardAmount.value = task.rewardAmount || 1;
            taskRewardItem.value = task.rewardItemId || '';
            taskDepsInput.value = (task.dependencies || []).join(', ');
            toggleRewardItemInput(task.rewardType === 'item');
            btnTaskSubmit.textContent = t('task_save');
            taskFormContainer.style.display = 'block';
            btnAddTask.style.display = 'none';
            taskFormContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function deleteTask(id) {
            data.tasks = data.tasks.filter(t => t.id !== id);
            saveData();
            renderTasks();
            showNotification(t('notif_task_deleted'), 'warning');
            if (editingTaskId === id) cancelTaskEdit();
        }

        function resetTask(id) {
            const task = data.tasks.find(t => t.id === id);
            if (!task) return;
            task.completed = false;
            task.completedSessions = 0;
            saveData();
            renderTasks();
            showNotification(t('notif_task_reset', { name: task.name }), 'success');
        }

        function cancelTaskEdit() {
            editingTaskId = null;
            taskFormContainer.style.display = 'none';
            btnAddTask.style.display = 'inline-block';
            btnTaskSubmit.textContent = t('task_save');
            taskForm.reset();
            taskRewardItem.value = '';
            toggleRewardItemInput(false);
        }

        function toggleRewardItemInput(show) {
            taskRewardItemGroup.style.display = show ? 'block' : 'none';
        }

        taskRewardType.addEventListener('change', function() {
            toggleRewardItemInput(this.value === 'item');
        });

        taskForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = taskNameInput.value.trim();
            const description = taskDescInput.value.trim();
            const targetSessions = parseInt(taskTargetInput.value);
            const rewardType = taskRewardType.value;
            const rewardAmount = parseInt(taskRewardAmount.value) || 1;
            const rewardItemId = taskRewardItem.value.trim() || null;
            const depsRaw = taskDepsInput.value.trim();
            const dependencies = depsRaw ? depsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

            if (!name || isNaN(targetSessions) || targetSessions < 1) {
                return showNotification(t('notif_error_task_form'), 'error');
            }

            for (const depId of dependencies) {
                if (!findItem(depId)) {
                    return showNotification(t('notif_error_task_dep_missing', { id: depId }), 'warning');
                }
            }

            if (rewardType === 'item' && rewardItemId) {
                if (!findItem(rewardItemId)) {
                    return showNotification(t('notif_error_task_reward_item_missing', { id: rewardItemId }), 'error');
                }
            }

            const taskData = {
                name,
                description,
                targetSessions,
                rewardType,
                rewardAmount,
                rewardItemId: rewardType === 'item' ? rewardItemId : null,
                dependencies
            };

            if (editingTaskId) {
                const idx = data.tasks.findIndex(t => t.id === editingTaskId);
                if (idx !== -1) {
                    const old = data.tasks[idx];
                    data.tasks[idx] = {
                        ...old,
                        name: taskData.name,
                        description: taskData.description,
                        targetSessions: taskData.targetSessions,
                        rewardType: taskData.rewardType,
                        rewardAmount: taskData.rewardAmount,
                        rewardItemId: taskData.rewardItemId,
                        dependencies: taskData.dependencies,
                    };
                    saveData();
                    renderTasks();
                    showNotification(t('notif_task_updated', { name: taskData.name }), 'success');
                    cancelTaskEdit();
                } else {
                    showNotification(t('notif_error_task_missing'), 'error');
                }
            } else {
                addTask(taskData);
                cancelTaskEdit();
            }
        });

        btnAddTask.addEventListener('click', function() {
            taskFormContainer.style.display = 'block';
            btnAddTask.style.display = 'none';
            taskForm.reset();
            editingTaskId = null;
            btnTaskSubmit.textContent = t('task_save');
            toggleRewardItemInput(false);
            taskFormContainer.scrollIntoView({ behavior: 'smooth' });
        });

        btnTaskCancel.addEventListener('click', function() {
            cancelTaskEdit();
        });

        // =========================================================
        //  商店渲染
        // =========================================================
        function renderStore() {
            const items = getAllItems();
            storeItemsEl.innerHTML = '';
            if (items.length === 0) {
                storeItemsEl.innerHTML = `<div class="empty-message"><i class="fas fa-store"></i> ${t('empty_store')}</div>`;
                return;
            }
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                const canBuy = data.tomatoes >= item.price;
                const isUserItem = String(item.id).startsWith('u_');
                const deps = item.dependencies || [];
                const depCheck = checkDependencies(deps);
                const hasDeps = deps.length > 0;

                let depHTML = '';
                if (hasDeps) {
                    const depNames = getDependencyNames(deps);
                    const statusClass = depCheck.ok ? 'dep-ok' : 'dep-miss';
                    const statusText = depCheck.ok ? t('dependency_ok') : t('dependency_miss');
                    depHTML = `
                        <div class="dep-list">📦 ${t('dependencies')}: ${depNames.join(' → ')}</div>
                        <span class="dependency-badge ${statusClass}">${statusText}</span>
                    `;
                }

                let actionsHTML = `
                    <button class="btn btn-accent btn-buy" data-id="${item.id}" ${canBuy ? '' : 'disabled'}>
                        ${canBuy ? t('btn_buy') : t('insufficient')}
                    </button>
                `;
                if (isUserItem) {
                    actionsHTML += `
                        <button class="btn btn-secondary btn-sm btn-edit" data-id="${item.id}" title="${t('btn_edit')}"><i class="fas fa-pen"></i></button>
                        <button class="btn btn-danger btn-sm btn-remove" data-id="${item.id}" title="${t('btn_remove')}"><i class="fas fa-trash"></i></button>
                    `;
                }

                div.innerHTML = `
                    <div class="item-icon"><i class="${item.icon}"></i></div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-desc">${item.desc || ' '}</div>
                    <div class="item-price">${item.price} 🍅</div>
                    ${depHTML}
                    <div class="item-actions">${actionsHTML}</div>
                `;
                storeItemsEl.appendChild(div);

                div.querySelector('.btn-buy').addEventListener('click', function(e) {
                    e.stopPropagation();
                    purchaseItem(this.dataset.id);
                });
                const editBtn = div.querySelector('.btn-edit');
                if (editBtn) editBtn.addEventListener('click', function(e) { e.stopPropagation();
                    startEditing(this.dataset.id); });
                const removeBtn = div.querySelector('.btn-remove');
                if (removeBtn) removeBtn.addEventListener('click', function(e) { e.stopPropagation();
                    removeUserItem(this.dataset.id); });
            });
        }

        function purchaseItem(itemId) {
            const item = findItem(itemId);
            if (!item) return showNotification(t('notif_error_item_not_found'), 'error');
            if (data.tomatoes < item.price) return showNotification(t('notif_error_insufficient'), 'error');
            data.tomatoes -= item.price;
            const key = String(item.id);
            if (data.backpack[key]) {
                data.backpack[key].count++;
            } else {
                data.backpack[key] = { id: item.id, name: item.name, icon: item.icon, effect: item.effect,
                    count: 1, dependencies: item.dependencies || [] };
            }
            saveData();
            updateStatsUI();
            renderStore();
            renderBackpack();
            showNotification(t('notif_purchase', { name: item.name }), 'success');
        }

        function removeUserItem(itemId) {
            const idx = data.userItems.findIndex(i => String(i.id) === String(itemId));
            if (idx === -1) return showNotification(t('notif_error_cannot_remove_default'), 'error');
            const removed = data.userItems.splice(idx, 1)[0];
            const key = String(itemId);
            if (data.backpack[key]) delete data.backpack[key];
            saveData();
            renderStore();
            renderBackpack();
            if (editingItemId === String(itemId)) cancelEditing();
            showNotification(t('notif_removed', { name: removed.name }), 'warning');
        }

        // =========================================================
        //  背包渲染
        // =========================================================
        function renderBackpack() {
            const keys = Object.keys(data.backpack);
            backpackItemsEl.innerHTML = '';
            if (keys.length === 0) {
                backpackItemsEl.innerHTML =
                    `<div class="empty-message"><i class="fas fa-backpack"></i> ${t('empty_backpack')}</div>`;
                return;
            }
            keys.forEach(key => {
                const item = data.backpack[key];
                const fullItem = findItem(key);
                const deps = fullItem ? (fullItem.dependencies || []) : (item.dependencies || []);
                const depCheck = checkDependencies(deps);

                const div = document.createElement('div');
                div.className = 'backpack-item';

                let depStatus = '';
                if (deps.length > 0) {
                    const depNames = getDependencyNames(deps);
                    const cls = depCheck.ok ? 'dep-ok' : 'dep-miss';
                    const txt = depCheck.ok ? '✅' : '❌';
                    depStatus = `<div style="font-size:0.65rem;color:var(--gray);">${txt} ${depNames.join(' → ')}</div>`;
                }

                const canUse = depCheck.ok;

                div.innerHTML = `
                    <div class="item-count">${item.count}</div>
                    <div class="item-icon"><i class="${item.icon}"></i></div>
                    <div class="item-name">${item.name}</div>
                    ${depStatus}
                    <button class="btn ${canUse ? 'btn-primary' : 'btn-outline'} btn-use" data-id="${key}" ${canUse ? '' : 'disabled'}>
                        ${canUse ? t('btn_use') : t('btn_missing_dep')}
                    </button>
                `;
                backpackItemsEl.appendChild(div);
                div.querySelector('.btn-use').addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (!canUse) {
                        const miss = depCheck.missing.map(id => findItem(id)?.name || id).join(', ');
                        showNotification(t('dep_missing') + miss, 'error');
                        return;
                    }
                    useItem(key);
                });
            });
        }

        function useItem(itemId) {
            const item = data.backpack[itemId];
            if (!item || item.count <= 0) return;
            const fullItem = findItem(itemId);
            const deps = fullItem ? (fullItem.dependencies || []) : (item.dependencies || []);
            const depCheck = checkDependencies(deps);
            if (!depCheck.ok) {
                const miss = depCheck.missing.map(id => findItem(id)?.name || id).join(', ');
                showNotification(t('dep_missing') + miss, 'error');
                return;
            }
            const effect = item.effect || (fullItem ? fullItem.effect : 'rest');
            if (effect === 'lootbox') {
                const result = openLootbox();
                let msg = '';
                if (result.type === 'tomato') {
                    data.tomatoes += result.amount;
                    msg = t('notif_lootbox_tomato', { amount: result.amount });
                } else if (result.type === 'exp') {
                    data.exp += result.amount;
                    checkLevelUp();
                    msg = t('notif_lootbox_exp', { amount: result.amount });
                } else {
                    msg = t('notif_lootbox_empty');
                }
                item.count--;
                if (item.count <= 0) delete data.backpack[itemId];
                saveData();
                updateStatsUI();
                renderBackpack();
                renderStore();
                showNotification(`🎁 ${msg}`, 'success');
                return;
            }
            applyEffect(item);
            item.count--;
            if (item.count <= 0) delete data.backpack[itemId];
            saveData();
            updateStatsUI();
            renderBackpack();
            renderStore();
        }

        function applyEffect(item) {
            const effect = item.effect;
            switch (effect) {
                case 'rest':
                    timeLeft = Math.max(timeLeft, 5 * 60);
                    updateTimerDisplay();
                    updateProgress();
                    updateStatus('🛌 ' + t('notif_effect_rest'));
                    showNotification(t('notif_effect_rest'), 'success');
                    break;
                case 'focus':
                    timeLeft = Math.min(timeLeft + 10 * 60, 45 * 60);
                    updateTimerDisplay();
                    updateProgress();
                    updateStatus('🎯 ' + t('notif_effect_focus'));
                    showNotification(t('notif_effect_focus'), 'success');
                    break;
                case 'tomato':
                    data.tomatoes += 2;
                    saveData();
                    updateStatsUI();
                    showNotification(t('notif_effect_tomato'), 'success');
                    break;
                case 'exp':
                    data.exp += 25;
                    checkLevelUp();
                    saveData();
                    updateStatsUI();
                    showNotification(t('notif_effect_exp'), 'success');
                    break;
                default:
                    showNotification(t('notif_purchase', { name: item.name }), 'success');
            }
        }

        // =========================================================
        //  创建 / 更新商品
        // =========================================================
        function getFormData() {
            const depsRaw = $('item-deps').value.trim();
            const deps = depsRaw ? depsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
            return {
                name: $('item-name').value.trim(),
                desc: $('item-desc').value.trim(),
                price: parseInt($('item-price').value),
                icon: $('item-icon').value,
                effect: $('item-effect').value,
                dependencies: deps
            };
        }

        function validateForm(data) {
            if (!data.name || !data.desc || isNaN(data.price) || data.price < 1) {
                showNotification(t('notif_error_invalid_form'), 'error');
                return false;
            }
            for (const depId of data.dependencies) {
                if (!findItem(depId)) {
                    showNotification(t('notif_error_dep_missing', { id: depId }), 'warning');
                    return false;
                }
            }
            return true;
        }

        function saveItemFromForm() {
            const formData = getFormData();
            if (!validateForm(formData)) return null;

            if (editingItemId) {
                const index = data.userItems.findIndex(i => String(i.id) === editingItemId);
                if (index === -1) { showNotification(t('notif_error_item_not_found'), 'error');
                    cancelEditing(); return null; }
                const oldItem = data.userItems[index];
                const updated = { ...oldItem, ...formData };
                data.userItems[index] = updated;
                const key = editingItemId;
                if (data.backpack[key]) {
                    data.backpack[key].name = updated.name;
                    data.backpack[key].icon = updated.icon;
                    data.backpack[key].effect = updated.effect;
                    data.backpack[key].dependencies = updated.dependencies;
                }
                saveData();
                showNotification(t('notif_updated', { name: updated.name }), 'success');
                cancelEditing();
                return updated;
            } else {
                const newItem = { id: 'u_' + Date.now(), ...formData };
                data.userItems.push(newItem);
                saveData();
                showNotification(t('notif_created', { name: newItem.name }), 'success');
                itemForm.reset();
                $('item-deps').value = '';
                return newItem;
            }
        }

        itemForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const saved = saveItemFromForm();
            if (saved) { renderStore();
                renderBackpack();
                updateStatsUI(); }
        });

        // =========================================================
        //  导出单个商品 (.shom)
        // =========================================================
        function exportSingleItem(item, filenamePrefix = '商品') {
            const exportData = { userItems: [item], backpack: {}, tasks: [], customTabs: [], version: '1.0' };
            const json = JSON.stringify(exportData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;

        // =========================================================
        //  统计
        // =========================================================
        function renderStats() {
            const dailyEl = $('daily-stats');
            const weeklyEl = $('weekly-stats');
            const monthlyEl = $('monthly-stats');
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekStart = new Date(now);
            weekStart.setDate(now.getDate() - now.getDay());
            weekStart.setHours(0, 0, 0, 0);
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

            function filterHistory(startDate) {
                return data.history.filter(h => new Date(h.date) >= startDate);
            }

            function calcStats(records) {
                let tomatoes = 0,
                    exp = 0,
                    sessions = records.length;
                records.forEach(r => { tomatoes += r.tomatoesEarned || 0;
                    exp += r.expEarned || 0; });
                return { tomatoes, exp, sessions };
            }

            function renderStatBlock(el, records, label) {
                const s = calcStats(records);
                const expNeeded = data.level * 100;
                const expProgress = Math.min(100, (data.exp / expNeeded) * 100);
                el.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat-card"><div class="icon">🍅</div><div class="number">${s.tomatoes}</div><div class="label">${t('stat-tomato')}</div></div>
                        <div class="stat-card"><div class="icon">⏱️</div><div class="number">${s.sessions}</div><div class="label">${t('stat-exp')}</div></div>
                        <div class="stat-card"><div class="icon">⭐</div><div class="number">${s.exp}</div><div class="label">${t('stat-level')}</div></div>
                        <div class="stat-card"><div class="icon">📊</div><div class="number">${data.level}</div><div class="label">${t('stat-level')}</div></div>
                    </div>
                    <div style="margin-top:8px;">
                        <div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--gray);">
                            <span>${t('stat-exp')}</span><span>${data.exp} / ${expNeeded}</span>
                        </div>
                        <div class="level-bar"><div class="level-progress" style="width:${expProgress}%;"></div></div>
                    </div>
                    <p style="margin-top:12px;font-size:0.85rem;color:var(--gray);">${label} · ${s.sessions} ${t('nav-timer')}</p>
                `;
            }
            renderStatBlock(dailyEl, filterHistory(today), t('stats-tab-daily'));
            renderStatBlock(weeklyEl, filterHistory(weekStart), t('stats-tab-weekly'));
            renderStatBlock(monthlyEl, filterHistory(monthStart), t('stats-tab-monthly'));
        }

        function downloadJSON(data, filename) {
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importFile(accept, callback) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = accept;
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        callback(data);
                    } catch (err) {
                        showNotification(t('notif_error_import_parse'), 'error');
                        console.error(err);
                    }
                };
                reader.readAsText(file);
                input.remove();
            };
            input.click();
        }

                            renderTasks();
                            renderCustomTabs();
                            showNotification(t('notif_import_zid', { itemAdded, itemUpdated, taskAdded, taskUpdated, tabAdded }), 'success');
                        } else if (type === 'taem') {
                            // 任务导入
                            if (!imported.tasks || !Array.isArray(imported.tasks)) {
                                throw new Error('无效的任务文件');
                            }
                            let added = 0, updated = 0;
                            imported.tasks.forEach(impTask => {
                                if (!impTask.dependencies) impTask.dependencies = [];
                                const idx = data.tasks.findIndex(t => t.id === impTask.id);
                                if (idx !== -1) {
                                    const old = data.tasks[idx];
                                    data.tasks[idx] = { ...impTask, completedSessions: old.completedSessions || 0, completed: old.completed || false };
                                    updated++;
                                } else {
                                    data.tasks.push(impTask);
                                    added++;
                                }
                            });
                            saveData();
                            renderTasks();
                            showNotification(t('notif_import_tasks', { added, updated }), 'success');
                        } else {
                            throw new Error('未知模组类型');
                        }
                        showNotification(t('notif_install_success', { name }), 'success');
                    } catch (err) {
                        console.error(err);
                        showNotification('❌ 安装失败: ' + err.message, 'error');
                    } finally {
                        this.disabled = false;
                        this.innerHTML = `<i class="fas fa-download"></i> ${t('market_install')}`;
                    }
                });
            });
        }

        // 市场刷新
        function renderMarket() {
            const container = document.getElementById('market-list');
            container.innerHTML = `<div class="empty-message"><i class="fas fa-spinner fa-spin"></i> 加载模组列表中...</div>`;
            loadMarketMods();
        }

        // 刷新按钮
        $('btn-refresh-market').addEventListener('click', renderMarket);

        // =========================================================
        //  键盘快捷键
        // =========================================================
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')
                return;
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning && !isPaused) pauseTimer();
                else if (isRunning && isPaused) startTimer();
                else startTimer();
            }
            if (e.code === 'KeyR' && !e.ctrlKey && !e.metaKey) { e.preventDefault();
                resetTimer(); }
        });

        // =========================================================
        //  语言切换按钮
        // =========================================================
        document.getElementById('lang-toggle').addEventListener('click', function() {
            const newLang = currentLang === 'zh' ? 'en' : 'zh';
            setLanguage(newLang);
            renderStore();
            renderBackpack();
            renderTasks();
            renderStats();
            renderCustomTabs();
            renderMarket();
            updateStatus(t('status-ready'));
        });

        // =========================================================
        //  初始化
        // =========================================================
        btnStart.addEventListener('click', startTimer);
        btnPause.addEventListener('click', pauseTimer);
        btnReset.addEventListener('click', resetTimer);
        $('btn-refresh-store').addEventListener('click', renderStore);

        function init() {
            currentLang = 'zh';
            setLanguage('zh');
            durationInput.value = Math.floor(WORK_TIME / 60);
            updateStatsUI();
            updateTimerDisplay();
            updateProgress();
            setButtons(false, false);
            renderStore();
            renderBackpack();
            renderTasks();
            renderCustomTabs();
            // 加载市场（但不切换）
            renderMarket();
            switchSection('timer');
            renderStats();
            updateStatus(t('status-ready'));
            taskFormContainer.style.display = 'none';
            btnAddTask.style.display = 'inline-block';
        }
        init();
        console.log('🍅 番茄闹钟 v3.6 · 支持模组市场！');
    </script>
</body>
</html>
