name: 📦 模组提交 / Mod Submission
description: 提交你的番茄闹钟模组 / Submit your tomato clock mod
title: "[新模组] "
labels: ["模组提交"]
body:
  - type: input
    id: name
    attributes:
      label: 模组名称 / Mod Name
      placeholder: 例如 / e.g. Xbox 手柄
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 作者 / Author
      placeholder: 你的 GitHub 用户名 / Your GitHub username
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 描述 / Description
      placeholder: 简要描述模组功能 / Brief description of the mod
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 类型 / Type
      options:
        - shom (商品)
        - shem (商品-旧格式)
        - zid (模组)
        - zod (模组-旧格式)
        - taem (任务)
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: 文件链接 / File Link
      description: 提供模组文件的下载链接（可以是 GitHub 附件或其他托管服务）
      placeholder: https://raw.githubusercontent.com/.../mods/xxx.shem
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: 图标类名 / Icon Class
      description: FontAwesome 图标类名，例如 fa-gamepad
      placeholder: fa-gamepad
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: 标签 / Tags
      description: 用逗号分隔，例如 工具, 游戏
      placeholder: 工具, 游戏
    validations:
      required: false
