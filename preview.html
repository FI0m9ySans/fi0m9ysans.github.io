<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍅 番茄闹钟 · 开发预览</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: linear-gradient(145deg, #f0f2f5, #dbe0e8);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 40px 50px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.08);
        }
        .badge {
            display: inline-block;
            background: #f1c40f;
            color: #1e2a3a;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }
        h1 { font-size: 2rem; margin-bottom: 8px; }
        h1 i { color: #e74c3c; margin-right: 10px; }
        .subtitle { color: #7f8c8d; margin-bottom: 32px; }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin: 24px 0;
        }
        .feature-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid transparent;
            transition: 0.3s;
        }
        .feature-card:hover {
            border-color: #3498db;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        .feature-card .icon { font-size: 2.4rem; margin-bottom: 8px; }
        .feature-card h3 { font-size: 1.1rem; margin-bottom: 4px; }
        .feature-card p { color: #7f8c8d; font-size: 0.9rem; }
        .feature-card .status {
            display: inline-block;
            font-size: 0.7rem;
            margin-top: 8px;
            padding: 2px 12px;
            border-radius: 20px;
            background: #e3f0fd;
            color: #2980b9;
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #3498db;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .feature-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <span class="badge">🚧 开发预览版</span>
    <h1><i class="fas fa-flask"></i> 未来功能预览</h1>
    <p class="subtitle">以下功能正在开发中，将随下一个版本上线</p>

    <div class="feature-grid">
        <!-- 功能卡片 1 -->
        <div class="feature-card">
            <div class="icon">🎮</div>
            <h3>成就系统</h3>
            <p>解锁各种成就，获得额外奖励</p>
            <span class="status">开发中</span>
        </div>
        <!-- 功能卡片 2 -->
        <div class="feature-card">
            <div class="icon">📊</div>
            <h3>数据统计报表</h3>
            <p>查看番茄完成趋势和周报月报</p>
            <span class="status">规划中</span>
        </div>
        <!-- 功能卡片 3 -->
        <div class="feature-card">
            <div class="icon">🌙</div>
            <h3>深色主题</h3>
            <p>夜间模式，更护眼</p>
            <span class="status">已完成</span>
        </div>
        <!-- 功能卡片 4 -->
        <div class="feature-card">
            <div class="icon">🧩</div>
            <h3>模组依赖管理</h3>
            <p>像 Forge/Fabric 一样管理模组依赖</p>
            <span class="status">开发中</span>
        </div>
        <!-- 功能卡片 5 -->
        <div class="feature-card">
            <div class="icon">💾</div>
            <h3>云存档</h3>
            <p>登录账号，数据跨设备同步</p>
            <span class="status">规划中</span>
        </div>
        <!-- 功能卡片 6 -->
        <div class="feature-card">
            <div class="icon">🎨</div>
            <h3>更多主题</h3>
            <p>内置多种配色方案</p>
            <span class="status">已完成</span>
        </div>
    </div>

    <a href="./" class="back-link"><i class="fas fa-arrow-left"></i> 返回番茄闹钟</a>
</div>
</body>
</html>
