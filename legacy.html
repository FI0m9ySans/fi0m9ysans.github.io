<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍅 番茄闹钟 · 轻量版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== 全局样式（精简） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .app {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            padding: 24px 20px;
            position: relative;
        }
        h1 {
            text-align: center;
            color: #1e2a3a;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }
        h1 i {
            color: #e74c3c;
            margin-right: 10px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px 0;
            margin-bottom: 20px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e2a3a;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #7f8c8d;
            text-transform: uppercase;
        }
        .timer-box {
            text-align: center;
            padding: 20px 0;
        }
        .timer-display {
            font-size: 4.5rem;
            font-weight: 700;
            color: #1e2a3a;
            letter-spacing: 2px;
        }
        .timer-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-primary { background: #e74c3c; color: white; }
        .btn-secondary { background: #3498db; color: white; }
        .btn-accent { background: #2ecc71; color: white; }
        .btn-gold { background: #f1c40f; color: #1e2a3a; }
        .btn-outline { background: transparent; border: 2px solid #ddd; color: #7f8c8d; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ecf0f1;
            border-radius: 4px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #e74c3c;
            width: 0%;
            transition: width 1s linear;
        }
        .status {
            text-align: center;
            color: #7f8c8d;
            font-size: 1rem;
            min-height: 28px;
        }

        /* 商店 & 背包 */
        .panel {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
        }
        .panel h2 {
            font-size: 1.2rem;
            color: #1e2a3a;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .item-card {
            background: white;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .item-card .icon {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }
        .item-card .name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .item-card .price {
            color: #e74c3c;
            font-weight: 700;
            font-size: 0.85rem;
            margin: 4px 0;
        }
        .item-card .btn {
            width: 100%;
            justify-content: center;
            font-size: 0.8rem;
            padding: 6px 0;
        }
        .backpack-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .backpack-item {
            background: white;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            position: relative;
        }
        .backpack-item .count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .backpack-item .btn {
            font-size: 0.7rem;
            padding: 4px 10px;
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid #ddd;
        }
        .tab {
            padding: 8px 16px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 500;
            color: #7f8c8d;
        }
        .tab.active {
            color: #e74c3c;
            border-bottom-color: #e74c3c;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .hidden {
            display: none;
        }

        /* 通知 */
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a3a;
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            font-weight: 500;
            z-index: 999;
        }
        .notification.show {
            opacity: 1;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .timer-display { font-size: 3.5rem; }
            .stats { flex-wrap: wrap; gap: 8px; }
            .item-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <h1><i class="fas fa-stopwatch"></i> 番茄闹钟 · 轻量</h1>

    <!-- 状态栏 -->
    <div class="stats">
        <div class="stat-item">
            <div class="stat-value" id="tomato-display">0</div>
            <div class="stat-label">🍅 番茄币</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="exp-display">0</div>
            <div class="stat-label">⭐ 经验</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="level-display">1</div>
            <div class="stat-label">📊 等级</div>
        </div>
    </div>

    <!-- 计时器 -->
    <div class="timer-box">
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="timer-controls">
            <button class="btn btn-primary" id="btnStart">开始</button>
            <button class="btn btn-secondary" id="btnPause" disabled>暂停</button>
            <button class="btn btn-outline" id="btnReset" disabled>重置</button>
        </div>
        <div class="status" id="statusMsg">准备开始</div>
    </div>

    <!-- 标签切换 -->
    <div class="tabs">
        <div class="tab active" data-tab="store">🛒 商店</div>
        <div class="tab" data-tab="backpack">🎒 背包</div>
    </div>

    <!-- 商店 -->
    <div class="tab-content active" id="tab-store">
        <div class="panel">
            <h2>商店</h2>
            <div class="item-grid" id="storeGrid"></div>
        </div>
    </div>

    <!-- 背包 -->
    <div class="tab-content" id="tab-backpack">
        <div class="panel">
            <h2>我的背包</h2>
            <div class="backpack-grid" id="backpackGrid"></div>
        </div>
    </div>
</div>

<!-- 通知 -->
<div class="notification" id="notification">消息</div>

<script>
    // =========================================================
    //  使用 ES5 语法（兼容旧浏览器）
    // =========================================================
    (function() {
        "use strict";

        // ---- 数据 ----
        var STORAGE_KEY = 'tomato_legacy';
        var data = loadData();
        var WORK_TIME = 25 * 60;      // 25 分钟
        var timeLeft = WORK_TIME;
        var timerInterval = null;
        var isRunning = false;
        var isPaused = false;

        // ---- DOM 引用 ----
        var timerDisplay = document.getElementById('timerDisplay');
        var progressFill = document.getElementById('progressFill');
        var statusMsg = document.getElementById('statusMsg');
        var tomatoDisplay = document.getElementById('tomato-display');
        var expDisplay = document.getElementById('exp-display');
        var levelDisplay = document.getElementById('level-display');
        var btnStart = document.getElementById('btnStart');
        var btnPause = document.getElementById('btnPause');
        var btnReset = document.getElementById('btnReset');
        var storeGrid = document.getElementById('storeGrid');
        var backpackGrid = document.getElementById('backpackGrid');
        var notification = document.getElementById('notification');

        // ---- 预设商品（与旧版一致） ----
        var PRESET_ITEMS = [
            { id: 'p1', name: '休息5分钟', price: 1, icon: 'fas fa-coffee', effect: 'rest', desc: '增加5分钟休息' },
            { id: 'p2', name: '专注加成', price: 2, icon: 'fas fa-brain', effect: 'focus', desc: '专注+10分钟' },
            { id: 'p3', name: '双倍奖励', price: 5, icon: 'fas fa-gem', effect: 'tomato', desc: '番茄币x2' },
            { id: 'p4', name: '经验加成', price: 3, icon: 'fas fa-star', effect: 'exp', desc: '额外25%经验' },
            { id: 'p5', name: '惊喜宝箱', price: 8, icon: 'fas fa-box', effect: 'lootbox', desc: '随机奖励' }
        ];

        // ---- 数据读写 ----
        function getDefaultData() {
            return {
                tomatoes: 0,
                exp: 0,
                level: 1,
                backpack: {}   // 键为 itemId，值为 { id, name, icon, effect, count }
            };
        }

        function loadData() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    var parsed = JSON.parse(raw);
                    // 确保必要字段存在
                    if (typeof parsed.tomatoes === 'undefined') parsed.tomatoes = 0;
                    if (typeof parsed.exp === 'undefined') parsed.exp = 0;
                    if (typeof parsed.level === 'undefined') parsed.level = 1;
                    if (typeof parsed.backpack === 'undefined') parsed.backpack = {};
                    return parsed;
                }
            } catch (e) {}
            return getDefaultData();
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        // ---- UI 更新 ----
        function updateStats() {
            tomatoDisplay.textContent = data.tomatoes;
            expDisplay.textContent = data.exp;
            levelDisplay.textContent = data.level;
        }

        function updateTimer() {
            var minutes = Math.floor(timeLeft / 60);
            var seconds = timeLeft % 60;
            timerDisplay.textContent = (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
            var progress = ((WORK_TIME - timeLeft) / WORK_TIME) * 100;
            progressFill.style.width = progress + '%';
        }

        function setButtons(running, paused) {
            btnStart.disabled = running || paused;
            btnPause.disabled = !running || paused;
            btnReset.disabled = !running && !paused;
            if (paused) btnStart.disabled = false;
        }

        function updateStatus(text) {
            statusMsg.textContent = text;
        }

        // ---- 计时器逻辑 ----
        function startTimer() {
            if (isRunning && !isPaused) return;
            if (timeLeft <= 0) { resetTimer(); return; }
            isRunning = true;
            isPaused = false;
            setButtons(true, false);
            updateStatus('专注中...');
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(function() {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) {
                    completeTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning || isPaused) return;
            isPaused = true;
            clearInterval(timerInterval);
            timerInterval = null;
            setButtons(true, true);
            updateStatus('已暂停');
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            isPaused = false;
            timeLeft = WORK_TIME;
            updateTimer();
            setButtons(false, false);
            updateStatus('准备开始');
        }

        function completeTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            isPaused = false;
            setButtons(false, false);

            var earnedTomato = 1;
            var earnedExp = 10;
            data.tomatoes += earnedTomato;
            data.exp += earnedExp;
            // 检查升级
            var needed = data.level * 100;
            while (data.exp >= needed) {
                data.exp -= needed;
                data.level++;
                needed = data.level * 100;
                showNotification('🎊 升级！等级 ' + data.level);
            }
            saveData();
            updateStats();
            updateStatus('✅ 完成 +1🍅 +10⭐');
            showNotification('🎉 完成一个番茄！');
            timeLeft = WORK_TIME;
            updateTimer();
        }

        // ---- 商店 ----
        function getAllItems() {
            return PRESET_ITEMS.slice(); // 无用户自定义，仅预设
        }

        function renderStore() {
            var items = getAllItems();
            var html = '';
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var canBuy = data.tomatoes >= item.price;
                html += '<div class="item-card">';
                html += '<div class="icon"><i class="' + item.icon + '"></i></div>';
                html += '<div class="name">' + item.name + '</div>';
                html += '<div class="price">' + item.price + ' 🍅</div>';
                html += '<button class="btn btn-gold" data-id="' + item.id + '" ' + (canBuy ? '' : 'disabled') + '>' + (canBuy ? '购买' : '余额不足') + '</button>';
                html += '</div>';
            }
            storeGrid.innerHTML = html;

            // 绑定购买事件
            var buyBtns = storeGrid.querySelectorAll('.btn-gold');
            for (var j = 0; j < buyBtns.length; j++) {
                (function(btn) {
                    btn.addEventListener('click', function() {
                        var id = this.getAttribute('data-id');
                        purchaseItem(id);
                    });
                })(buyBtns[j]);
            }
        }

        function purchaseItem(itemId) {
            var items = getAllItems();
            var item = null;
            for (var i = 0; i < items.length; i++) {
                if (items[i].id === itemId) { item = items[i]; break; }
            }
            if (!item) return;
            if (data.tomatoes < item.price) return;

            data.tomatoes -= item.price;
            var key = item.id;
            if (data.backpack[key]) {
                data.backpack[key].count++;
            } else {
                data.backpack[key] = {
                    id: item.id,
                    name: item.name,
                    icon: item.icon,
                    effect: item.effect,
                    count: 1
                };
            }
            saveData();
            updateStats();
            renderStore();
            renderBackpack();
            showNotification('✅ 购买 ' + item.name);
        }

        // ---- 背包 ----
        function renderBackpack() {
            var keys = Object.keys(data.backpack);
            if (keys.length === 0) {
                backpackGrid.innerHTML = '<p style="color:#7f8c8d;text-align:center;">背包空空</p>';
                return;
            }
            var html = '';
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                var item = data.backpack[key];
                html += '<div class="backpack-item">';
                html += '<span class="count">' + item.count + '</span>';
                html += '<div class="icon"><i class="' + item.icon + '"></i></div>';
                html += '<div class="name">' + item.name + '</div>';
                html += '<button class="btn btn-accent" data-id="' + key + '">使用</button>';
                html += '</div>';
            }
            backpackGrid.innerHTML = html;

            var useBtns = backpackGrid.querySelectorAll('.btn-accent');
            for (var j = 0; j < useBtns.length; j++) {
                (function(btn) {
                    btn.addEventListener('click', function() {
                        var id = this.getAttribute('data-id');
                        useItem(id);
                    });
                })(useBtns[j]);
            }
        }

        function useItem(itemId) {
            var item = data.backpack[itemId];
            if (!item || item.count <= 0) return;

            // 应用效果
            applyEffect(item);
            item.count--;
            if (item.count <= 0) {
                delete data.backpack[itemId];
            }
            saveData();
            updateStats();
            renderBackpack();
            renderStore();
        }

        function applyEffect(item) {
            var effect = item.effect;
            switch (effect) {
                case 'rest':
                    timeLeft = Math.max(timeLeft, 5 * 60);
                    updateTimer();
                    updateStatus('🛌 休息5分钟');
                    showNotification('☕ 休息时间+5分钟');
                    break;
                case 'focus':
                    timeLeft = Math.min(timeLeft + 10 * 60, 45 * 60);
                    updateTimer();
                    updateStatus('🎯 专注+10分钟');
                    showNotification('🎯 专注时间+10分钟');
                    break;
                case 'tomato':
                    data.tomatoes += 2;
                    saveData();
                    updateStats();
                    showNotification('🍅 获得2个番茄币！');
                    break;
                case 'exp':
                    data.exp += 25;
                    // 升级检查
                    var needed = data.level * 100;
                    while (data.exp >= needed) {
                        data.exp -= needed;
                        data.level++;
                        needed = data.level * 100;
                        showNotification('🎊 升级！等级 ' + data.level);
                    }
                    saveData();
                    updateStats();
                    showNotification('⭐ 获得25经验值！');
                    break;
                case 'lootbox':
                    // 简单随机奖励
                    var rewards = ['tomato', 'exp', 'nothing'];
                    var r = rewards[Math.floor(Math.random() * rewards.length)];
                    if (r === 'tomato') {
                        data.tomatoes += 3;
                        saveData();
                        updateStats();
                        showNotification('🎁 开箱得到 3🍅！');
                    } else if (r === 'exp') {
                        data.exp += 15;
                        var needed2 = data.level * 100;
                        while (data.exp >= needed2) {
                            data.exp -= needed2;
                            data.level++;
                            needed2 = data.level * 100;
                            showNotification('🎊 升级！等级 ' + data.level);
                        }
                        saveData();
                        updateStats();
                        showNotification('🎁 开箱得到 15⭐！');
                    } else {
                        showNotification('😅 宝箱是空的…');
                    }
                    break;
                default:
                    showNotification('使用 ' + item.name);
            }
        }

        // ---- 通知 ----
        var notiTimer = null;
        function showNotification(text) {
            notification.textContent = text;
            notification.classList.add('show');
            clearTimeout(notiTimer);
            notiTimer = setTimeout(function() {
                notification.classList.remove('show');
            }, 3000);
        }

        // ---- 标签切换 ----
        var tabs = document.querySelectorAll('.tab');
        for (var i = 0; i < tabs.length; i++) {
            (function(tab) {
                tab.addEventListener('click', function() {
                    var target = this.getAttribute('data-tab');
                    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
                    this.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                    document.getElementById('tab-' + target).classList.add('active');
                });
            })(tabs[i]);
        }

        // ---- 按钮事件 ----
        btnStart.addEventListener('click', startTimer);
        btnPause.addEventListener('click', pauseTimer);
        btnReset.addEventListener('click', resetTimer);

        // ---- 初始化 ----
        function init() {
            updateStats();
            updateTimer();
            setButtons(false, false);
            updateStatus('🍅 准备开始');
            renderStore();
            renderBackpack();
            // 如果存在历史数据，恢复计时器状态（保持简单，仅重置）
        }
        init();

        // 暴露一些调试
        window.__tomato = { data: data, save: saveData };

    })();
</script>
</body>
</html>
