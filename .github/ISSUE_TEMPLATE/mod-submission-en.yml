name: "📦 Mod Submission (English)"
description: "Submit your tomato clock mod"
title: "[New Mod] "
labels: ["mod-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🍅 Tomato Mod Submission
        
        Thank you for contributing to the global mod repository! Please fill in the information below.
        
        > **Note:** Make sure your mod file is accessible via a direct download link (e.g., GitHub raw link).
  
  - type: input
    id: name
    attributes:
      label: Mod Name
      placeholder: e.g. Xbox Controller
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author
      placeholder: Your GitHub username
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Brief description of what this mod does
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Mod Type
      description: What type of file is this?
      options:
        - shom (Items + Backpack)
        - shem (Items + Backpack - Legacy)
        - zid (Full Mod + Tasks + Custom Tabs)
        - zod (Full Mod - Legacy)
        - taem (Tasks only)
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: File Link
      description: Direct download link to your mod file
      placeholder: https://raw.githubusercontent.com/username/repo/main/mods/xxx.shem
    validations:
      required: true

  - type: input
    id: icon
    attributes:
      label: Icon Class (Optional)
      description: FontAwesome icon class name
      placeholder: fa-gamepad
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: Tags (Optional)
      description: Comma separated, e.g. tools, game, hardware
      placeholder: tools, game, hardware
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ### 📌 After Submission
        
        - I will review your submission as soon as possible.
        - Once approved, your mod will be added to the global mod repository.
        - Thank you for your contribution! 🎉
